<!-- Firebase SDK (Realtime Database) -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getDatabase, ref, set, get, onValue, push, update, remove, off } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAGvkerJ71aH4tisdecNpLwiW_YntFwz_g",
    authDomain: "mapa-tec-f0b8b.firebaseapp.com",
    databaseURL: "https://mapa-tec-f0b8b-default-rtdb.firebaseio.com",
    projectId: "mapa-tec-f0b8b",
    storageBucket: "mapa-tec-f0b8b.firebasestorage.app",
    messagingSenderId: "417979815624",
    appId: "1:417979815624:web:a382206af7a171c3a977fd",
    measurementId: "G-3JLV6RDFJD"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  window.firebaseApp = app;
  window.firebaseDB = db;
  window.firebaseAuth = { isAuthenticated: () => true };

  // ─── Core Firebase helpers ────────────────────────────────────────────────

  async function saveToFirebase(path, data) {
    try {
      await set(ref(db, path), data);
      return true;
    } catch (e) {
      console.error(`Firebase save error (${path}):`, e);
      return false;
    }
  }

  async function loadFromFirebase(path) {
    try {
      const snap = await get(ref(db, path));
      return snap.exists() ? snap.val() : null;
    } catch (e) {
      console.error(`Firebase load error (${path}):`, e);
      return null;
    }
  }

  // ─── REAL-TIME LISTENER ───────────────────────────────────────────────────
  // Returns an unsubscribe function.  Fires callback immediately with current
  // data and then on every remote change.
  function listenToFirebase(path, callback) {
    const dbRef = ref(db, path);
    const unsub = onValue(dbRef, (snap) => {
      callback(snap.exists() ? snap.val() : null);
    });
    return unsub;   // call unsub() to stop listening
  }

  function stopListening(path) {
    off(ref(db, path));
  }

  // Auth stubs kept for UI compatibility
  function updateAuthUI() {
    const authStatus = document.getElementById('auth-status');
    if (authStatus) {
      authStatus.innerHTML = '<span class="badge bg-success"><i class="fas fa-cloud"></i> Firebase compartido – tiempo real</span>';
    }
    ['login-section','logout-btn','sync-section'].forEach(id => {
      const el = document.getElementById(id);
      if (el) el.style.display = 'none';
    });
    window.dispatchEvent(new CustomEvent('authStateChanged', { detail: { authenticated: true } }));
  }

  function initAuth() { updateAuthUI(); }

  // ─── Expose globals ───────────────────────────────────────────────────────
  window.firebaseSave          = saveToFirebase;
  window.firebaseLoad          = loadFromFirebase;
  window.firebaseListen        = listenToFirebase;
  window.firebaseStopListening = stopListening;
  window.firebaseInitAuth      = initAuth;
  window.firebaseLogin         = async () => { updateAuthUI(); return true; };
  window.firebaseLogout        = () => { updateAuthUI(); };

  console.log("Firebase Realtime Database (tiempo real) inicializado.");
</script>

<script id="app-script">
// ─── Globals ────────────────────────────────────────────────────────────────
let map, markers = [], allRecords = [], techColors = {}, techImages = {}, customCoords = [];
let currentRecord = null, technicianList = [], countdownInterval = null;
window.currentSuggestions = [];
let alertsEnabled = localStorage.getItem('alertsEnabled') !== 'false';
let selectedZone = localStorage.getItem('selectedZone') || 'LIMA';

// Unsubscribe handles for Firebase listeners
let _unsubRecords = null, _unsubCoords = null;

const INTERVALS = [
  {name:'8/12',  start:8,  end:12},
  {name:'12/16', start:12, end:16},
  {name:'16/20', start:16, end:20}
];

const saved = localStorage.getItem('techImages');
if (saved) techImages = JSON.parse(saved);
const savedCoords = localStorage.getItem(`customCoords_${selectedZone}`);
if (savedCoords) customCoords = JSON.parse(savedCoords);

// ─── Helper ─────────────────────────────────────────────────────────────────
function normalizeString(str) {
  return str ? str.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase() : '';
}

// ─── Realtime indicator ──────────────────────────────────────────────────────
let _fadeTimer = null;
function flashRealtimeIndicator(msg) {
  const el = document.getElementById('realtime-indicator');
  if (!el) return;
  if (_fadeTimer) clearTimeout(_fadeTimer);
  el.classList.remove('fade-out');
  el.classList.add('show');
  el.innerHTML = `<i class="fas fa-sync-alt fa-spin me-1"></i> ${msg || 'Mapa actualizado en tiempo real'}`;
  _fadeTimer = setTimeout(() => {
    el.classList.add('fade-out');
    setTimeout(() => el.classList.remove('show','fade-out'), 600);
  }, 3000);
}

// ─── Bootstrap Firebase real-time listeners for the current zone ─────────────
function subscribeToZone(zone) {
  // Tear down previous listeners
  if (_unsubRecords) { _unsubRecords(); _unsubRecords = null; }
  if (_unsubCoords)  { _unsubCoords();  _unsubCoords  = null; }

  let firstRecords = true, firstCoords = true;

  // ── Records ──────────────────────────────────────────────────────────────
  _unsubRecords = window.firebaseListen(`records/${zone}`, (data) => {
    const incoming = Array.isArray(data) ? data : (data ? Object.values(data) : []);
    allRecords = incoming;
    localStorage.setItem(`records_${zone}`, JSON.stringify(allRecords));
    populateFilters();
    renderMarkers();
    updateStatistics();
    showLoading(false);
    if (!firstRecords) flashRealtimeIndicator('Registros actualizados');
    firstRecords = false;
  });

  // ── Custom coords ─────────────────────────────────────────────────────────
  _unsubCoords = window.firebaseListen(`coords/${zone}`, (data) => {
    const incoming = Array.isArray(data) ? data : (data ? Object.values(data) : []);
    customCoords = incoming;
    localStorage.setItem(`customCoords_${zone}`, JSON.stringify(customCoords));
    renderCustomCoordsList();
    updateCategoryCheckboxes();
    renderMarkers();
    if (!firstCoords) flashRealtimeIndicator('Coordenadas actualizadas');
    firstCoords = false;
  });
}

function updateCheckboxVisibility() {
  document.querySelectorAll('#category-checkboxes div[data-zone]').forEach(div => {
    div.style.display = div.dataset.zone === selectedZone ? 'flex' : 'none';
  });
}
function updateFormatToggleLabel(toggle) {
  const label = document.querySelector(`label[for="${toggle.id}"]`);
  if (label) label.classList.toggle('bg-yellow', toggle.checked);
}
function shouldApplyFormatting(estado) {
  if (!estado) return false;
  const hour = new Date().getHours();
  if (/Pendiente\s*-\s*8\/12/.test(estado))  return localStorage.getItem('format-8-12')  === 'true' && hour >= 8  && hour < 12;
  if (/Pendiente\s*-\s*12\/16/.test(estado)) return localStorage.getItem('format-12-16') === 'true' && hour >= 12 && hour < 16;
  if (/Pendiente\s*-\s*16\/20/.test(estado)) return localStorage.getItem('format-16-20') === 'true' && hour >= 16 && hour < 20;
  return false;
}
function showLoading(show) { document.getElementById('loading-overlay').style.display = show ? 'flex' : 'none'; }

// ─── Filters & rendering ─────────────────────────────────────────────────────
function populateFilters() {
  const set = (id, html) => { const el=document.getElementById(id); if(el) el.innerHTML=html; };
  const tramoFilter   = document.getElementById('tramo-filter');
  const estadoFilter  = document.getElementById('estado-filter');
  const tecnicoFilter = document.getElementById('tecnico-filter');
  const negocioFilter = document.getElementById('negocio-filter');
  const distritoFilter= document.getElementById('distrito-filter');
  if(!tramoFilter) return;
  tramoFilter.innerHTML   = '<option value="">Todos los tramos</option>';
  estadoFilter.innerHTML  = '<option value="">Todos los estados</option>';
  tecnicoFilter.innerHTML = '<option value="">Todos los técnicos</option>';
  negocioFilter.innerHTML = '<option value="">Todos los negocios</option>';
  distritoFilter.innerHTML= '<option value="">Todos los distritos</option>';

  const tramos   = [...new Set(allRecords.map(r=>r.Tramo).filter(Boolean))].sort();
  const estados  = [...new Set(allRecords.map(r=>r.Estado2).filter(Boolean))].sort();
  const tecnicos = [...new Set(allRecords.map(r=>r.Tecnico).filter(Boolean))].sort();
  const negocios = [...new Set(allRecords.map(r=>r.Negocio).filter(Boolean))].sort();
  const distMap  = new Map();
  allRecords.forEach(r => { if(r.Distrito) { const n=normalizeString(r.Distrito); if(!distMap.has(n)) distMap.set(n,r.Distrito); }});
  const distritos = Array.from(distMap.values()).sort();

  tramos.forEach(t   => tramoFilter.insertAdjacentHTML('beforeend',   `<option value="${t}">${t}</option>`));
  distritos.forEach(d=> distritoFilter.insertAdjacentHTML('beforeend',`<option value="${d}">${d}</option>`));
  estadoFilter.insertAdjacentHTML('beforeend','<option value="pendiente_combinado">PENDIENTE</option>');
  estados.forEach(e  => estadoFilter.insertAdjacentHTML('beforeend',  `<option value="${e}">${e}</option>`));
  tecnicos.forEach(t => tecnicoFilter.insertAdjacentHTML('beforeend', `<option value="${t}">${t}</option>`));
  tecnicoFilter.insertAdjacentHTML('beforeend','<option value="sin_tecnico">Sin técnico</option>');
  negocios.forEach(n => negocioFilter.insertAdjacentHTML('beforeend', `<option value="${n}">${n}</option>`));

  const imgSelect = document.getElementById('image-tecnico-select');
  if (imgSelect) {
    imgSelect.innerHTML = '<option value="">Selecciona técnico</option><option value="sin_tecnico">Sin técnico</option>';
    tecnicos.forEach(t => imgSelect.insertAdjacentHTML('beforeend', `<option value="${t}">${t}</option>`));
  }
  renderTechnicianSummary();
}

function applyFilters() {
  const t    = document.getElementById('tramo-filter')?.value;
  const e    = document.getElementById('estado-filter')?.value;
  const tech = document.getElementById('tecnico-filter')?.value;
  const neg  = document.getElementById('negocio-filter')?.value;
  const dist = document.getElementById('distrito-filter')?.value;
  clearMarkers();
  let filtered = allRecords;
  if (t)    filtered = filtered.filter(r => r.Tramo === t);
  if (e) {
    if (e === 'pendiente_combinado') filtered = filtered.filter(r => ['PROGRAMADO','EN CAMINO','COORDINADO'].includes(r.Estado2));
    else filtered = filtered.filter(r => r.Estado2 === e);
  }
  if (tech) filtered = filtered.filter(r => tech === 'sin_tecnico' ? !r.Tecnico : r.Tecnico === tech);
  if (neg)  filtered = filtered.filter(r => r.Negocio === neg);
  if (dist) { const nd=normalizeString(dist); filtered = filtered.filter(r => normalizeString(r.Distrito)===nd); }
  renderMarkersFromRecords(filtered);
  if (markers.length > 0) map.fitBounds(new L.featureGroup(markers).getBounds(), {padding:[50,50]});
}

function renderMarkers() {
  clearMarkers();
  renderMarkersFromRecords(allRecords);
  if (markers.length > 0) map.fitBounds(new L.featureGroup(markers).getBounds(), {padding:[50,50]});
}

function renderMarkersFromRecords(records) {
  clearMarkers();
  const colors = ['#4285F4','#EA4335','#FBBC05','#34A853','#8E24AA'];
  const tecnicos = [...new Set(records.map(r=>r.Tecnico).filter(Boolean))];
  tecnicos.forEach((t,i) => { if (!techColors[t]) techColors[t] = colors[i % colors.length]; });
  techColors['sin_tecnico'] = '#9E9E9E';

  const showTooltips = localStorage.getItem('showTooltips') !== 'false';

  const visibleCategories = {};
  document.querySelectorAll('#category-checkboxes input[type="checkbox"]:checked').forEach(cb => {
    const z = cb.dataset.zone;
    if (!visibleCategories[z]) visibleCategories[z] = [];
    visibleCategories[z].push(cb.dataset.category);
  });

  records.forEach(record => {
    const lat = record.latitud_Y, lng = record.longitud_X;
    if (!lat || !lng) return;
    const estado = record.Estado || 'N/A';
    const color  = record.Tecnico && techColors[record.Tecnico] ? techColors[record.Tecnico] : techColors['sin_tecnico'];
    let marker;

    const imgSrc = record.Tecnico ? techImages[record.Tecnico] : techImages['sin_tecnico'];
    if (imgSrc) {
      marker = L.marker([lat,lng], { icon: L.icon({iconUrl:imgSrc, iconSize:[30,30], iconAnchor:[15,15]}) }).addTo(map);
      if (showTooltips) marker.bindTooltip(estado, { permanent:true, direction:'right', className: shouldApplyFormatting(estado)?'estado-label estado-pendiente':'estado-label', offset:[5,0] });
    } else {
      let html = `<div class="custom-pin" style="--color:${color}">${estado.charAt(0)}</div>`;
      if (showTooltips) html += `<div class="${shouldApplyFormatting(estado)?'estado-label estado-pendiente':'estado-label'}">${estado}</div>`;
      marker = L.marker([lat,lng], { icon: L.divIcon({ className:'custom-marker-container', html, iconSize:[100,30], iconAnchor:[15,15] }) }).addTo(map);
    }
    marker.on('contextmenu', e => { e.originalEvent.preventDefault(); showContextMenu(e.originalEvent.clientX, e.originalEvent.clientY, marker.record); });
    marker.record = record;
    marker.on('click', () => showRecordDetails(record));
    markers.push(marker);
  });

  // Custom coords
  const showKml = localStorage.getItem('showKmlPoints') === 'true';
  customCoords.forEach(c => {
    if (c.kml && !showKml) return;
    if (c.zone !== selectedZone) return;
    const coordZone = c.zone || selectedZone;
    if (!visibleCategories[coordZone] || !visibleCategories[coordZone].includes(c.category)) return;
    const catColors = {'Zona sin Cobertura':'#FF5722','Sin FFTT':'#9C27B0','Zona Peligrosa':'#F44336','Dirección de Técnicos':'#3F51B5'};
    let marker;
    if (c.imgData) {
      marker = L.marker([c.lat,c.lng], {icon: L.icon({iconUrl:c.imgData, iconSize:[30,30], iconAnchor:[15,15]})}).addTo(map);
    } else {
      const col = catColors[c.category] || '#607D8B';
      marker = L.marker([c.lat,c.lng], {icon: L.divIcon({className:'custom-pin', html:`<div class="custom-pin" style="--color:${col}">?</div>`, iconSize:[30,30], iconAnchor:[15,15]})}).addTo(map);
    }
    if (c.category === 'Dirección de Técnicos' && c.note)
      marker.bindTooltip(c.note, {permanent:true, direction:'right', className:'estado-label', offset:[5,0]});
    else
      marker.bindPopup(`<strong>${c.category}</strong><br>${c.note||''}`);
    marker.on('click', () => showRecordDetails(c));
    markers.push(marker);
  });
}

function clearMarkers() { markers.forEach(m => map.removeLayer(m)); markers = []; }

// ─── CRUD with Firebase sync ──────────────────────────────────────────────────
function deleteRecord(recordId) {
  showLoading(true);
  setTimeout(() => {
    const isManual = customCoords.some(c => c.id === recordId);
    if (isManual) {
      customCoords = customCoords.filter(c => c.id !== recordId);
      localStorage.setItem(`customCoords_${selectedZone}`, JSON.stringify(customCoords));
      window.firebaseSave(`coords/${selectedZone}`, customCoords);
      renderCustomCoordsList();
    } else {
      allRecords = allRecords.filter(r => r.id !== recordId);
      localStorage.setItem(`records_${selectedZone}`, JSON.stringify(allRecords));
      window.firebaseSave(`records/${selectedZone}`, allRecords);
      populateFilters();
    }
    document.getElementById('detail-panel').classList.remove('open');
    renderMarkers(); updateStatistics(); showLoading(false);
    alert('Registro eliminado correctamente');
  }, 500);
}

// ─── Excel upload → Firebase ──────────────────────────────────────────────────
function handleExcelUpload(e) {
  const file = e.target.files[0]; if (!file) return;
  showLoading(true);
  const reader = new FileReader();
  reader.onload = function (evt) {
    const data = new Uint8Array(evt.target.result);
    const wb = XLSX.read(data, {type:'array'});
    const json = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {defval:''});
    const newRecords = [], coordMap = new Map();
    json.forEach(row => {
      const lat = parseFloat(row.latitud_Y), lng = parseFloat(row.longitud_X);
      if (isNaN(lat)||isNaN(lng)) return;
      const key = `${lat},${lng}`;
      if (coordMap.has(key)) return;
      coordMap.set(key,true);
      newRecords.push({ id:row.id||row.ID||row.Codigo||Date.now()+Math.random(), Codigo:row.Codigo, Cliente:row.Cliente, Direccion:row.Direccion, longitud_X:lng, latitud_Y:lat, Ubicacion:row.Ubicacion, Location:row.Location||'', Distrito:row.Distrito, Tecnico:row.Tecnico, Estado:row.Estado, Observaciones:row.Observaciones, Estado2:row.Estado2, Tramo:row.Tramo, Negocio:row.Negocio });
    });
    allRecords = newRecords;
    localStorage.setItem(`records_${selectedZone}`, JSON.stringify(allRecords));

    // Push to Firebase → all connected users update automatically via onValue
    window.firebaseSave(`records/${selectedZone}`, allRecords).then(() => {
      flashRealtimeIndicator(`${newRecords.length} registros publicados en tiempo real`);
    });

    populateFilters(); renderMarkers(); updateStatistics(); showLoading(false);
    e.target.value = '';
  };
  reader.readAsArrayBuffer(file);
}

// ─── KML upload ───────────────────────────────────────────────────────────────
function handleKmlUpload(e) {
  const file = e.target.files[0]; if (!file) return;
  const msgEl = document.getElementById('kml-upload-msg');
  msgEl.textContent = 'Procesando archivo KML...'; msgEl.className = 'small mt-1 text-info';

  const modalHTML = `<div class="modal fade" id="categorySelectionModal" tabindex="-1"><div class="modal-dialog"><div class="modal-content"><div class="modal-header"><h5 class="modal-title">Seleccionar Categoría</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body"><p>Seleccione una categoría para todas las coordenadas del KML:</p><select id="kml-category-select" class="form-select"><option value="Zona sin Cobertura">Zona sin Cobertura</option><option value="Sin FFTT">Sin FFTT</option><option value="Zona Peligrosa">Zona Peligrosa</option><option value="Dirección de Técnicos">Dirección de Técnicos</option></select></div><div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button><button type="button" class="btn btn-primary" id="confirm-category-btn">Confirmar</button></div></div></div></div>`;
  const container = document.createElement('div'); container.innerHTML = modalHTML; document.body.appendChild(container);
  const modalEl = document.getElementById('categorySelectionModal'), modal = new bootstrap.Modal(modalEl); modal.show();

  document.getElementById('confirm-category-btn').addEventListener('click', function () {
    const cat = document.getElementById('kml-category-select').value;
    modal.hide(); showLoading(true);
    const reader = new FileReader();
    reader.onload = function(evt) {
      try {
        const doc = new DOMParser().parseFromString(evt.target.result, 'text/xml');
        const placemarks = doc.getElementsByTagName('Placemark');
        const newCoords = [];
        for (let i=0; i<placemarks.length; i++) {
          const pm = placemarks[i];
          const name = pm.querySelector('name')?.textContent||'';
          const coords = pm.getElementsByTagName('coordinates')[0]?.textContent.trim();
          if (!coords) continue;
          const parts = coords.split(',');
          if (parts.length < 2) continue;
          const lng = parseFloat(parts[0]), lat = parseFloat(parts[1]);
          if (isNaN(lat)||isNaN(lng)) continue;
          newCoords.push({ id:Date.now()+i, lat, lng, category:cat, note:name, imgData:null, zone:selectedZone, kml:true });
        }
        const mergedMap = new Map();
        customCoords.forEach(c => { if (c.kml && c.zone===selectedZone) return; mergedMap.set(`${c.lat},${c.lng},${c.zone}`,c); });
        newCoords.forEach(c => { const k=`${c.lat},${c.lng},${c.zone}`; const ex=mergedMap.get(k); if(ex&&ex.imgData)c.imgData=ex.imgData; mergedMap.set(k,c); });
        customCoords = Array.from(mergedMap.values());
        localStorage.setItem(`customCoords_${selectedZone}`, JSON.stringify(customCoords));
        window.firebaseSave(`coords/${selectedZone}`, customCoords).then(() => {
          flashRealtimeIndicator(`${newCoords.length} puntos KML publicados en tiempo real`);
        });
        renderCustomCoordsList(); updateCategoryCheckboxes(); renderMarkers();
        msgEl.textContent = `Procesadas ${newCoords.length} coordenadas del KML.`; msgEl.className='small mt-1 text-success';
        showLoading(false);
      } catch (err) { msgEl.textContent='Error KML: '+err.message; msgEl.className='small mt-1 text-danger'; showLoading(false); }
    };
    reader.readAsText(file);
  });
  modalEl.addEventListener('hidden.bs.modal', () => { if(container.parentNode===document.body) document.body.removeChild(container); });
}

// ─── Coord form ───────────────────────────────────────────────────────────────
function setupCoordForm() {
  document.getElementById('save-coord').addEventListener('click', () => {
    const loc = document.getElementById('coord-input').value.trim();
    const cat = document.getElementById('coord-category').value;
    if (!loc||!cat) { alert('Debe ingresar ubicación y categoría.'); return; }
    const parts = loc.split(',').map(s=>parseFloat(s.trim()));
    if (parts.length!==2||parts.some(isNaN)) { alert('Formato inválido. Use "lat, lng"'); return; }
    const note = document.getElementById('coord-note').value.trim();
    const file = document.getElementById('coord-image').files[0];
    const entry = { id:Date.now(), lat:parts[0], lng:parts[1], category:cat, note, imgData:null, zone:selectedZone };
    if (file) {
      const r = new FileReader();
      r.onload = e => { entry.imgData = e.target.result; saveAndRenderCoord(entry); };
      r.readAsDataURL(file);
    } else { saveAndRenderCoord(entry); }
  });
  document.getElementById('coord-input').addEventListener('input', function() {
    const parts = this.value.trim().split(',').map(s=>parseFloat(s.trim()));
    if (parts.length===2&&!parts.some(isNaN)) {
      if (window.tempPreviewMarker) map.removeLayer(window.tempPreviewMarker);
      window.tempPreviewMarker = L.marker([parts[0],parts[1]], {icon:L.divIcon({className:'custom-pin', html:`<div class="custom-pin" style="--color:#4285F4;opacity:.6">📍</div>`, iconSize:[30,30], iconAnchor:[15,15]})}).addTo(map);
      map.setView([parts[0],parts[1]],15);
    }
  });
  updateCategoryCheckboxes();
}

function saveAndRenderCoord(entry) {
  entry.zone = selectedZone;
  const mergedMap = new Map();
  customCoords.forEach(c => mergedMap.set(`${c.lat},${c.lng},${c.zone}`,c));
  const key = `${entry.lat},${entry.lng},${entry.zone}`;
  const ex = mergedMap.get(key);
  if (ex&&ex.imgData&&!entry.imgData) entry.imgData=ex.imgData;
  mergedMap.set(key,entry);
  customCoords = Array.from(mergedMap.values());
  localStorage.setItem(`customCoords_${selectedZone}`, JSON.stringify(customCoords));
  window.firebaseSave(`coords/${selectedZone}`, customCoords);
  renderCustomCoordsList(); updateCategoryCheckboxes(); renderMarkers();
  ['coord-input','coord-category','coord-note','coord-image'].forEach(id => document.getElementById(id).value='');
  alert('Coordenada guardada correctamente');
}

function updateCategoryCheckboxes() {
  const container = document.getElementById('category-checkboxes'); if(!container) return;
  container.innerHTML='';
  const counts={};
  customCoords.forEach(c => { const z=c.zone||selectedZone; const k=`${c.category}-${z}`; counts[k]=(counts[k]||0)+1; });
  const uniq=[...new Set(customCoords.map(c=>c.category))];
  uniq.forEach(category => {
    ['LIMA','PROVINCIA'].forEach(zone => {
      const k=`${category}-${zone}`; if(!counts[k]) return;
      const catId=`category-${category.replace(/\s+/g,'-').toLowerCase()}-${zone}`;
      const div=document.createElement('div'); div.className='form-check d-flex align-items-center'; div.dataset.zone=zone; div.style.display=zone===selectedZone?'flex':'none';
      const cb=document.createElement('input'); cb.className='form-check-input'; cb.type='checkbox'; cb.id=catId; cb.dataset.category=category; cb.dataset.zone=zone; cb.checked=localStorage.getItem(catId)!=='false';
      const lbl=document.createElement('label'); lbl.className='form-check-label me-2'; lbl.htmlFor=catId;
      lbl.textContent=`${category==='Dirección de Técnicos'?'Técnicos':category} (${counts[k]}) - ${zone}`;
      const imgBtn=document.createElement('button'); imgBtn.className='btn btn-sm btn-outline-secondary assign-category-image-btn ms-2'; imgBtn.innerHTML='<i class="fas fa-image"></i>'; imgBtn.title='Asignar imagen a todas'; imgBtn.dataset.category=category;
      const fileInp=document.createElement('input'); fileInp.type='file'; fileInp.accept='.jpg,.jpeg,.png'; fileInp.className='visually-hidden';
      imgBtn.addEventListener('click',()=>fileInp.click());
      fileInp.addEventListener('change',function(e){
        const f=e.target.files[0]; if(!f)return;
        const rdr=new FileReader();
        rdr.onload=function(evt){
          let n=0;
          customCoords.forEach(c=>{ if(c.category===category&&(c.zone||selectedZone)===zone){c.imgData=evt.target.result;n++;} });
          localStorage.setItem(`customCoords_${selectedZone}`,JSON.stringify(customCoords));
          window.firebaseSave(`coords/${selectedZone}`,customCoords);
          renderMarkers(); alert(`Imagen aplicada a ${n} coordenadas en "${category}" - ${zone}`); fileInp.value='';
        };
        rdr.readAsDataURL(f);
      });
      div.appendChild(cb); div.appendChild(lbl); div.appendChild(imgBtn); div.appendChild(fileInp);
      container.appendChild(div);
      cb.addEventListener('change',function(){ localStorage.setItem(this.id,this.checked); renderMarkers(); });
    });
  });
}

function renderCustomCoordsList() {
  const ul=document.getElementById('coord-list'); ul.innerHTML='';
  customCoords.forEach(c=>{
    const li=document.createElement('li'); li.className='list-group-item d-flex justify-content-between align-items-center';
    li.innerHTML=`<div>${c.category} (${c.lat.toFixed(4)}, ${c.lng.toFixed(4)})<br><small>${c.note||''}</small></div><button class="btn btn-sm btn-danger">&times;</button>`;
    li.querySelector('button').addEventListener('click',()=>{
      customCoords=customCoords.filter(x=>x.id!==c.id);
      localStorage.setItem(`customCoords_${selectedZone}`,JSON.stringify(customCoords));
      window.firebaseSave(`coords/${selectedZone}`,customCoords);
      renderCustomCoordsList(); renderMarkers();
    });
    ul.appendChild(li);
  });
  updateCategoryCheckboxes();
}

// ─── Delete / restore by category ────────────────────────────────────────────
function deleteRecordsByCategory(category) {
  const modalHTML=`<div class="modal fade" id="deleteCategoryModal" tabindex="-1"><div class="modal-dialog"><div class="modal-content"><div class="modal-header"><h5 class="modal-title">Confirmar Eliminación</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body"><p>¿Eliminar completamente la categoría <strong>${category}</strong>?</p></div><div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button><button type="button" class="btn btn-danger" id="confirm-delete-category-btn">Eliminar Permanentemente</button></div></div></div></div>`;
  const mc=document.createElement('div'); mc.innerHTML=modalHTML; document.body.appendChild(mc);
  const modalEl=document.getElementById('deleteCategoryModal'), modal=new bootstrap.Modal(modalEl); modal.show();
  document.getElementById('confirm-delete-category-btn').addEventListener('click',function(){
    const toDelete=customCoords.filter(c=>c.category===category);
    customCoords=customCoords.filter(c=>c.category!==category);
    const del=JSON.parse(localStorage.getItem('deletedRecordsByCategory')||'{}');
    del[category]=toDelete;
    localStorage.setItem('deletedRecordsByCategory',JSON.stringify(del));
    localStorage.setItem(`customCoords_${selectedZone}`,JSON.stringify(customCoords));
    window.firebaseSave(`coords/${selectedZone}`,customCoords);
    renderCustomCoordsList(); updateCategoryCheckboxes(); renderMarkers();
    document.getElementById('detail-panel').classList.remove('open');
    modal.hide(); alert(`Categoría "${category}" eliminada.`);
  });
  modalEl.addEventListener('hidden.bs.modal',()=>{ if(mc.parentNode===document.body) document.body.removeChild(mc); });
}

function restoreRecordsByCategory(category) {
  const del=JSON.parse(localStorage.getItem('deletedRecordsByCategory')||'{}');
  if (!del[category]||!del[category].length) return;
  customCoords=customCoords.concat(del[category]); delete del[category];
  localStorage.setItem('deletedRecordsByCategory',JSON.stringify(del));
  localStorage.setItem(`customCoords_${selectedZone}`,JSON.stringify(customCoords));
  window.firebaseSave(`coords/${selectedZone}`,customCoords);
  renderCustomCoordsList(); updateCategoryCheckboxes(); renderMarkers();
  document.getElementById('detail-panel').classList.remove('open');
  alert(`Categoría "${category}" restaurada.`);
}

// ─── Record details panel ─────────────────────────────────────────────────────
function showRecordDetails(record) {
  currentRecord=record;
  const detailPanel=document.getElementById('detail-panel'), recordDetails=document.getElementById('record-details');
  const isManual=!record.Codigo&&record.category!==undefined;
  let html='';
  if (isManual) {
    const catOptions=['Zona sin Cobertura','Sin FFTT','Zona Peligrosa','Dirección de Técnicos'].map(cat=>`<option value="${cat}"${cat===record.category?' selected':''}>${cat}</option>`).join('');
    html=`<div class="mb-3 p-3 bg-light rounded"><h6 class="mb-2">Coordenada Manual</h6><div class="mb-2"><strong>Coordenadas:</strong> ${record.lat.toFixed(6)}, ${record.lng.toFixed(6)}</div></div>
      <div class="row g-3"><div class="col-12"><strong>Categoría:</strong><select id="update-category-dropdown" class="form-select form-select-sm mt-1">${catOptions}</select></div>
      <div class="col-12"><strong>Observación:</strong><textarea id="coord-observation" class="form-control mt-1">${record.note||''}</textarea></div>
      <div class="col-12 mt-3"><button id="update-coord-btn" class="btn btn-primary">Actualizar Coordenada</button></div></div>
      <div class="col-12 mt-3"><button id="delete-category-btn" class="btn btn-danger">Eliminar Todos de Esta Categoría</button>
      <button id="restore-category-btn" class="btn btn-warning ms-2" style="display:none;">Restaurar Categoría</button></div>`;
  } else {
    const allTechs=[...new Set(allRecords.map(r=>r.Tecnico).filter(Boolean))];
    let techOptions='<option value="">Sin asignar</option>'+allTechs.map(t=>`<option value="${t}"${t===record.Tecnico?' selected':''}>${t}</option>`).join('');
    const estadoBadge=record.Estado==='Completado'?'bg-success':record.Estado==='En proceso'?'bg-primary':'bg-warning';
    const estado2Badge=record.Estado2==='Normal'?'bg-info':'bg-danger';
    const isPendiente=record.Estado&&/^Pendiente\s*-\s*(8\/12|12\/16|16\/20)$/.test(record.Estado);
    let countdownHtml=isPendiente?`<div class="col-12 mt-2"><div id="detail-countdown" class="alert alert-danger">Calculando tiempo restante para ${record.Estado}...</div></div>`:'';
    let suggHtml='';
    if (!record.Tecnico) {
      const sugg=getTechnicianSuggestions(record); window.currentSuggestions=sugg;
      if (sugg.length) suggHtml=`<div class="col-12 mt-2"><h6>Técnicos Sugeridos:</h6><div class="d-flex flex-wrap gap-2" id="tech-suggestions">${sugg.map(t=>`<button class="btn btn-sm btn-outline-primary tech-suggestion-btn" data-tech="${t}">${t}</button>`).join('')}</div></div>`;
    } else { window.currentSuggestions=[]; }
    html=`<div class="mb-2"><strong>Código:</strong> ${record.Codigo} <span class="ms-3"><strong>Negocio:</strong> ${record.Negocio}</span></div>
      <div class="mb-3 p-3 bg-light rounded"><h6 class="mb-2">${record.Cliente}</h6></div>
      <div class="row g-3"><div class="col-12"><strong>Dirección:</strong> ${record.Direccion}</div>
      <div class="col-12"><strong>Location:</strong>${record.Location||'<em>No location provided</em>'}</div>
      <div class="col-12"><strong>Distrito:</strong> ${record.Distrito}</div>
      <div class="col-12"><strong>Técnico:</strong><select id="assign-tech-dropdown" class="form-select form-select-sm mt-1">${techOptions}</select></div>
      ${suggHtml}
      <div class="col-6"><strong>Estado:</strong> <span class="badge ${estadoBadge}">${record.Estado}</span></div>
      <div class="col-6"><strong>Estado 2:</strong> <span class="badge ${estado2Badge}">${record.Estado2}</span></div>
      ${countdownHtml}
      <div class="col-12"><strong>Observaciones:</strong><textarea id="record-observation" class="form-control mt-1">${record.Observaciones||''}</textarea>
      <button id="save-observation-btn" class="btn btn-sm btn-outline-primary mt-2">Guardar Observación</button></div>
      <div class="col-12"><strong>Tramo:</strong> ${record.Tramo}</div></div>
      <div class="mt-4 border-top pt-3"><h6>Descargar Registros Asignados</h6><div class="btn-group"><button id="download-excel" class="btn btn-sm btn-success"><i class="fas fa-file-excel me-1"></i> Excel</button><button id="download-csv" class="btn btn-sm btn-primary"><i class="fas fa-file-csv me-1"></i> CSV</button></div></div>`;
  }
  recordDetails.innerHTML=html;
  if (isManual) {
    document.getElementById('update-coord-btn').addEventListener('click',()=>updateManualCoordinate(record.id,document.getElementById('update-category-dropdown').value,document.getElementById('coord-observation').value));
    document.getElementById('delete-category-btn').addEventListener('click',()=>{ if(confirm(`¿Eliminar todos de la categoría "${record.category}"?`)) deleteRecordsByCategory(record.category); });
    const del=JSON.parse(localStorage.getItem('deletedRecordsByCategory')||'{}');
    if (del[record.category]&&del[record.category].length>0) {
      const rb=document.getElementById('restore-category-btn'); rb.style.display='inline-block';
      rb.addEventListener('click',()=>{ if(confirm(`¿Restaurar ${del[record.category].length} registros eliminados?`)) restoreRecordsByCategory(record.category); });
    }
  } else {
    document.getElementById('assign-tech-dropdown').addEventListener('change',function(){ updateRecordTechnician(record.id,this.value); });
    document.getElementById('save-observation-btn').addEventListener('click',()=>updateRecordObservation(record.id,document.getElementById('record-observation').value));
    document.getElementById('download-excel').addEventListener('click',downloadRecordsAsExcel);
    document.getElementById('download-csv').addEventListener('click',downloadRecordsAsCSV);
    document.querySelectorAll('.tech-suggestion-btn').forEach(btn=>btn.addEventListener('click',function(){
      updateRecordTechnician(record.id,this.getAttribute('data-tech'));
      const u=allRecords.find(r=>r.id===record.id); if(u) showRecordDetails(u);
    }));
  }
  detailPanel.classList.add('open');
  renderTechnicianSummary();
}

// ─── Statistics ───────────────────────────────────────────────────────────────
function updateStatistics() {
  const n=allRecords.filter(r=>!r.Tecnico).length;
  const el=document.getElementById('no-tech-summary');
  if (el) el.innerHTML=`Sin técnico: <span class="badge bg-secondary">${n}</span> registros`;
}

function renderTechnicianSummary() {
  const summaryContent=document.getElementById('tech-summary-content'); if(!summaryContent)return;
  const techSummary={}, noTechName='Sin técnico';
  allRecords.forEach(r=>{
    const t=r.Tecnico||noTechName;
    if(!techSummary[t]) techSummary[t]={total:0};
    techSummary[t].total++;
  });
  let html='<table class="table table-sm table-borderless mb-0"><thead><tr><th>Técnico</th><th>Pend</th></tr></thead><tbody>';
  Object.keys(techSummary).sort((a,b)=>a===noTechName?1:b===noTechName?-1:a.localeCompare(b)).forEach(tech=>{
    const isSug=window.currentSuggestions&&window.currentSuggestions.includes(tech);
    html+=`<tr><td class="text-nowrap ${isSug?'tech-suggested-highlight':''}">${tech}</td><td><span class="badge bg-yellow text-dark">${techSummary[tech].total}</span></td></tr>`;
  });
  html+='</tbody></table>';
  summaryContent.innerHTML=html;
}

// ─── Search ───────────────────────────────────────────────────────────────────
function searchByCodigo() {
  const raw=document.getElementById('codigo-search').value.trim();
  const msgEl=document.getElementById('codigo-search-msg'); msgEl.textContent='';
  if (!raw){msgEl.textContent='Ingrese un Código.';return;}
  const num=Number(raw);
  const record=allRecords.find(r=>{ const c=r.Codigo,cn=Number(c); return !isNaN(num)&&!isNaN(cn)?cn===num:String(c)===raw; });
  if (!record){msgEl.textContent=`Código "${raw}" no encontrado.`;return;}
  map.setView([record.latitud_Y,record.longitud_X],16);
  L.popup({offset:[0,-15]}).setLatLng([record.latitud_Y,record.longitud_X]).setContent(`<div><strong>Código:</strong> ${record.Codigo}<br><strong>Cliente:</strong> ${record.Cliente}</div>`).openOn(map);
  showRecordDetails(record);
}

// ─── Downloads ────────────────────────────────────────────────────────────────
function downloadRecordsAsExcel() { const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(allRecords),'Registros'); XLSX.writeFile(wb,'registros_asignados.xlsx'); }
function downloadRecordsAsCSV() { const csv=XLSX.utils.sheet_to_csv(XLSX.utils.json_to_sheet(allRecords)); const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'})); a.download='registros_asignados.csv'; a.click(); }

// ─── Technician suggestions ───────────────────────────────────────────────────
function getTechnicianSuggestions(record) {
  if (record.Tecnico) return [];
  const workload={}, byDistrict={}, locations={};
  allRecords.forEach(r=>{
    if (!r.Tecnico) return;
    workload[r.Tecnico]=(workload[r.Tecnico]||0)+1;
    if (r.Distrito){if(!byDistrict[r.Distrito])byDistrict[r.Distrito]=new Set(); byDistrict[r.Distrito].add(r.Tecnico);}
    if (r.latitud_Y&&r.longitud_X&&!locations[r.Tecnico]) locations[r.Tecnico]={lat:r.latitud_Y,lng:r.longitud_X};
  });
  const inDistrict=record.Distrito&&byDistrict[record.Distrito]?Array.from(byDistrict[record.Distrito]):[];
  return Object.keys(workload).map(t=>({t, score:(inDistrict.includes(t)?100:0)-(workload[t]*5)})).sort((a,b)=>b.score-a.score).slice(0,5).map(x=>x.t);
}

// ─── Countdown ────────────────────────────────────────────────────────────────
function startCountdownTimer() { if(countdownInterval) clearInterval(countdownInterval); countdownInterval=setInterval(updateCountdowns,1000); }
function updateCountdowns() {
  const now=new Date(), hour=now.getHours();
  let soon=0;
  markers.filter(m=>m.record&&m.record.Estado&&/^Pendiente\s*-\s*(8\/12|12\/16|16\/20)$/.test(m.record.Estado)).forEach(marker=>{
    const interval=getIntervalFromRange(marker.record.Estado.split('-')[1].trim());
    if (!interval||hour<interval.start||hour>=interval.end) return;
    const end=new Date(now); end.setHours(interval.end,0,0,0);
    const rem=end-now; const min=Math.floor(rem/60000),sec=Math.floor((rem%60000)/1000);
    if(min<=0&&sec<=0){onCountdownEnd(marker.record,marker);return;}
    if(min<=10) soon++;
    const el=marker.getElement(); if(!el)return;
    let ov=el.querySelector('.countdown-overlay');
    if(!ov){ov=document.createElement('div');ov.className='countdown-overlay';el.appendChild(ov);}
    ov.style.display='block'; ov.textContent=`${String(min).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
  });
  const go=document.getElementById('global-timer-overlay');
  if(go){go.style.display=soon>0?'block':'none'; if(soon>0)go.textContent=`${soon} pendiente${soon!==1?'s':''} por vencer`;}
}
function getIntervalFromRange(tr){return INTERVALS.find(i=>i.name===tr)||null;}
function onCountdownEnd(record,marker){
  const el=marker.getElement(); if(el)el.classList.add('countdown-expired');
  marker.bindPopup(`Tiempo agotado (${record.Estado})`).openPopup();
  document.getElementById('alert-sound')?.play();
  if(Notification.permission==='granted') new Notification('Tiempo agotado',{body:`Registro ${record.Codigo} expirado`});
}

// ─── Map styles ───────────────────────────────────────────────────────────────
const MAP_STYLES=[
  {name:'CartoDB Positron', url:'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}.png', attribution:'&copy; CartoDB'},
  {name:'Light Mode', url:'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', attribution:'&copy; OpenStreetMap'},
  {name:'Esri WorldImagery', url:'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', attribution:'Tiles &copy; Esri'},
  {name:'Google Maps', url:'https://mt1.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', attribution:'&copy; Google Maps'},
  {name:'Google Hybrid', url:'https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', attribution:'&copy; Google Maps'}
];
let currentTileLayer;
function applyMapStyle(name){
  const s=MAP_STYLES.find(x=>x.name===name)||MAP_STYLES[0];
  if(currentTileLayer)map.removeLayer(currentTileLayer);
  currentTileLayer=L.tileLayer(s.url,{attribution:s.attribution}).addTo(map);
  const lbl=document.getElementById('current-style-label'); if(lbl)lbl.textContent=s.name;
  localStorage.setItem('selectedStyle',s.name); highlightSidebarStyle(s.name);
}
function setupStyleLegend(){
  const menu=document.querySelector('#style-legend .dropdown-menu'); if(!menu)return;
  menu.innerHTML='';
  MAP_STYLES.forEach(s=>{
    const li=document.createElement('li'); li.innerHTML=`<a class="dropdown-item" href="#">${s.name}</a>`;
    li.querySelector('a').addEventListener('click',e=>{e.preventDefault();applyMapStyle(s.name);});
    menu.appendChild(li);
  });
  buildSidebarStyleLegend();
}
function buildSidebarStyleLegend(){
  const ul=document.getElementById('sidebar-style-legend'); if(!ul)return; ul.innerHTML='';
  MAP_STYLES.forEach(s=>{
    const li=document.createElement('li'); li.textContent=s.name; li.dataset.style=s.name;
    li.addEventListener('click',()=>{applyMapStyle(s.name);highlightSidebarStyle(s.name);});
    ul.appendChild(li);
  });
  highlightSidebarStyle(localStorage.getItem('selectedStyle')||MAP_STYLES[0].name);
}
function highlightSidebarStyle(name){document.querySelectorAll('#sidebar-style-legend li').forEach(li=>li.classList.toggle('active',li.dataset.style===name));}

// ─── Context menu ─────────────────────────────────────────────────────────────
function showContextMenu(x,y,record){
  const cm=document.getElementById('context-menu'); if(!cm)return;
  cm.style.left=`${x}px`; cm.style.top=`${y}px`;
  technicianList.sort((a,b)=>a.localeCompare(b));
  let html=`<div class="context-menu-header">Asignar Técnico</div><div class="context-menu-item" data-tech="">Sin técnico</div><div class="context-menu-separator"></div>`;
  technicianList.forEach(t=>{ html+=`<div class="context-menu-item${t===record.Tecnico?' bg-light fw-bold':''}" data-tech="${t}">${t}</div>`; });
  html+=`<div class="context-menu-separator"></div><div class="context-menu-item text-danger" data-action="delete-tech">Eliminar Técnico</div><div class="context-menu-separator"></div><input type="text" class="form-control form-control-sm context-menu-input" id="new-tech-input" placeholder="Nuevo técnico..."><button class="btn btn-sm btn-primary context-menu-add-btn" id="add-tech-btn">Agregar Técnico</button>`;
  cm.innerHTML=html; cm.style.display='block';
  cm.querySelectorAll('.context-menu-item').forEach(item=>{
    item.addEventListener('click',function(){
      if(this.getAttribute('data-action')==='delete-tech'){
        const cur=record.Tecnico; if(!cur||!confirm(`¿Eliminar al técnico "${cur}" de la lista?`)){cm.style.display='none';return;}
        technicianList=technicianList.filter(t=>t!==cur);
        localStorage.setItem('technicianList',JSON.stringify(technicianList));
        window.firebaseSave('technicianList',technicianList);
        updateRecordTechnician(record.id,''); showContextMenu(x,y,record); return;
      }
      updateRecordTechnician(record.id,this.getAttribute('data-tech'));
      showRecordDetails(record); cm.style.display='none';
    });
  });
  const addBtn=document.getElementById('add-tech-btn');
  function addNewTech(){
    const inp=document.getElementById('new-tech-input'); if(!inp||!inp.value.trim())return;
    const nt=inp.value.trim();
    if(!technicianList.includes(nt)){technicianList.push(nt);technicianList.sort((a,b)=>a.localeCompare(b));localStorage.setItem('technicianList',JSON.stringify(technicianList));window.firebaseSave('technicianList',technicianList);}
    updateRecordTechnician(record.id,nt); showRecordDetails(record); cm.style.display='none';
  }
  if(addBtn) addBtn.addEventListener('click',addNewTech);
  document.getElementById('new-tech-input')?.addEventListener('keypress',e=>{if(e.key==='Enter')addNewTech();});
}

if(localStorage.getItem('showTooltips')===null) localStorage.setItem('showTooltips','true');
</script>
