<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tecsycom – Compartir Ubicación</title>
  <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/1865/1865269.png" type="image/x-icon">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;}
    body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(135deg,#1a1a2e,#16213e,#0f3460);color:white;font-family:sans-serif;padding:20px;}
    .card{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);border-radius:20px;padding:30px 24px;width:100%;max-width:360px;text-align:center;backdrop-filter:blur(10px);}
    .logo{font-size:48px;margin-bottom:10px;}
    h2{font-size:20px;margin-bottom:6px;font-weight:700;}
    .subtitle{font-size:13px;color:rgba(255,255,255,0.6);margin-bottom:24px;}
    select,input{width:100%;padding:12px 16px;border-radius:10px;border:1px solid rgba(255,255,255,0.2);background:rgba(255,255,255,0.1);color:white;font-size:15px;margin-bottom:12px;outline:none;cursor:pointer;}
    select option{background:#16213e;color:white;}
    select:focus,input:focus{border-color:rgba(255,255,255,0.5);background:rgba(255,255,255,0.15);}
    button{width:100%;padding:13px;border-radius:10px;border:none;background:linear-gradient(135deg,#00b4d8,#0077b6);color:white;font-size:15px;font-weight:bold;cursor:pointer;transition:opacity .2s;touch-action:manipulation;}
    button:hover{opacity:.9;}
    button:disabled{opacity:.5;cursor:not-allowed;}
    #status-panel{display:none;margin-top:4px;}
    .status-badge{display:inline-flex;align-items:center;gap:8px;background:rgba(40,167,69,0.2);border:1px solid #28a745;border-radius:30px;padding:8px 16px;font-size:13px;margin-bottom:16px;}
    .pulse{width:10px;height:10px;border-radius:50%;background:#28a745;animation:pulse 1.5s ease-in-out infinite;}
    @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(1.3)}}
    .info-box{background:rgba(255,255,255,0.05);border-radius:12px;padding:14px;margin-bottom:12px;font-size:13px;text-align:left;}
    .info-box label{color:rgba(255,255,255,0.5);font-size:11px;display:block;margin-bottom:2px;}
    .info-box span{color:white;font-weight:600;}
    #stop-btn{background:linear-gradient(135deg,#e63946,#c1121f);margin-top:8px;}
    .error-msg{color:#ff6b6b;font-size:12px;margin-top:8px;min-height:18px;}
    #last-update{font-size:11px;color:rgba(255,255,255,0.4);margin-top:4px;}
    .tag-ocupado{display:inline-block;background:rgba(230,57,70,0.25);border:1px solid #e63946;border-radius:6px;font-size:10px;padding:1px 6px;margin-left:6px;color:#ff8a8a;vertical-align:middle;}
  </style>
</head>
<body>
<div class="card">
  <div class="logo">🚗</div>
  <h2>Compartir Ubicación</h2>
  <p class="subtitle">Tecsycom – Seguimiento en tiempo real</p>

  <div id="login-panel">
    <select id="nombre-select"><option value="">Cargando técnicos...</option></select>
    <p class="error-msg" id="error-msg"></p>
    <button id="start-btn" onclick="startTracking()" disabled>Iniciar seguimiento</button>
  </div>

  <div id="status-panel">
    <div class="status-badge"><div class="pulse"></div><span>Ubicación activa</span></div>
    <div class="info-box">
      <label>Técnico</label>
      <span id="display-nombre">—</span>
    </div>
    <div class="info-box">
      <label>Última posición</label>
      <span id="display-coords">Obteniendo GPS...</span>
      <div id="last-update"></div>
    </div>
    <div id="wakelock-msg" style="font-size:11px;color:rgba(255,255,255,0.5);margin-bottom:10px;"></div>
    <button id="stop-btn" onclick="stopTracking()">Detener seguimiento</button>
    <button onclick="testManual()" style="margin-top:8px;background:rgba(255,165,0,0.8);">🧪 Test manual</button>
    <p id="test-msg" style="font-size:11px;color:rgba(255,255,255,0.6);margin-top:6px;"></p>
  </div>
</div>

<script>
const SUPABASE_URL='https://jxpeztieqwotfgswhzhx.supabase.co';
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp4cGV6dGllcXdvdGZnc3doemh4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA4MzQ4MDQsImV4cCI6MjA4NjQxMDgwNH0.Hf-lbGlP2OmH7Uh2LNKqwHkwHDp7yQV6O73aXw5NCZk';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

let watchId=null, fallbackInterval=null, nombre='', _channel=null, _lista=[];

async function sbLoadG(t){const{data,error}=await sb.from(t).select('data').eq('id','global').single();if(error)return null;return data?.data??null;}

window.addEventListener('load',async()=>{
  // Limpiar sesión anterior
  localStorage.removeItem('tracking_nombre');
  localStorage.removeItem('gps_count');

  const sel=document.getElementById('nombre-select');
  const errEl=document.getElementById('error-msg');

  // Cargar lista directo desde Supabase sin función intermedia
  try{
    const res=await fetch(`${SUPABASE_URL}/rest/v1/technician_list?id=eq.global&select=data`,{
      headers:{'apikey':SUPABASE_KEY,'Authorization':`Bearer ${SUPABASE_KEY}`}
    });
    const json=await res.json();
    const lista=Array.isArray(json[0]?.data)?json[0].data.sort():[];
    _lista=lista;

    if(lista.length===0){
      sel.innerHTML='<option value="">Sin técnicos disponibles</option>';
      errEl.textContent='Lista vacía. Contacta al gestor.';
      return;
    }

    // Cargar ocupados
    let ocupados=new Set();
    try{
      const{data:activos}=await sb.from('user_locations').select('nombre');
      ocupados=new Set((activos||[]).map(u=>u.nombre.toUpperCase()));
    }catch(e){}

    sel.innerHTML='<option value="">— Selecciona tu nombre —</option>';
    lista.forEach(t=>{
      const o=document.createElement('option');
      o.value=t;
      const estaOcupado=ocupados.has(t.toUpperCase());
      o.textContent=estaOcupado?`${t} (en uso)`:t;
      o.disabled=estaOcupado;
      o.style.color=estaOcupado?'#ff8a8a':'white';
      sel.appendChild(o);
    });
    document.getElementById('start-btn').disabled=true;
    sel.addEventListener('change',()=>{
      document.getElementById('start-btn').disabled=!sel.value;
      errEl.textContent='';
    });

    // Realtime para ocupados
    _channel=sb.channel('tracking_ocupados')
      .on('postgres_changes',{event:'*',schema:'public',table:'user_locations'},()=>{
        refreshOcupados(lista);
      })
      .subscribe();

  }catch(e){
    sel.innerHTML='<option value="">Error al cargar</option>';
    errEl.textContent=`Error: ${e.message}. Recarga la página.`;
  }
});

async function refreshOcupados(lista){
  const{data:activos}=await sb.from('user_locations').select('nombre');
  const ocupados=new Set((activos||[]).map(u=>u.nombre.toUpperCase()));
  const sel=document.getElementById('nombre-select');
  const currentVal=sel.value;
  sel.innerHTML='<option value="">— Selecciona tu nombre —</option>';
  lista.forEach(t=>{
    const o=document.createElement('option');
    o.value=t;
    const estaOcupado=ocupados.has(t.toUpperCase());
    o.textContent=estaOcupado?`${t} (en uso)`:t;
    o.disabled=estaOcupado;
    o.style.color=estaOcupado?'#ff8a8a':'white';
    if(t===currentVal)o.selected=true;
    sel.appendChild(o);
  });
  document.getElementById('start-btn').disabled=!sel.value||ocupados.has(sel.value.toUpperCase());
}

async function startTracking(){
  const sel=document.getElementById('nombre-select');
  const errEl=document.getElementById('error-msg');
  errEl.textContent='';
  if(!sel.value){errEl.textContent='Selecciona tu nombre para continuar.';return;}

  // Verificar una vez más que no esté ocupado
  const{data:activo}=await sb.from('user_locations').select('nombre').eq('nombre',sel.value).single();
  if(activo){errEl.textContent='Este nombre ya está siendo usado. Selecciona otro.';return;}

  if(!navigator.geolocation){errEl.textContent='Tu dispositivo no soporta GPS.';return;}
  nombre=sel.value;
  document.getElementById('start-btn').disabled=true;
  document.getElementById('start-btn').textContent='Activando GPS...';

  // Obtener primera posición
  document.getElementById('start-btn').textContent='Obteniendo GPS...';
  navigator.geolocation.getCurrentPosition(
    async(pos)=>{
      await saveLocation(pos.coords.latitude,pos.coords.longitude);
      localStorage.setItem('tracking_nombre',nombre);
      showActivePanel(nombre);

      // Solicitar nueva posición cada 5 segundos de forma agresiva
      fallbackInterval=setInterval(()=>{
        if(!nombre) return;
        navigator.geolocation.getCurrentPosition(
          pos=>saveLocation(pos.coords.latitude,pos.coords.longitude),
          err=>console.warn('GPS error:',err),
          {enableHighAccuracy:true, timeout:8000, maximumAge:0}
        );
      },5000);
    },
    (err)=>{
      document.getElementById('start-btn').disabled=false;
      document.getElementById('start-btn').textContent='Iniciar seguimiento';
      if(err.code===1) errEl.textContent='Permiso de ubicación denegado. Actívalo en ajustes.';
      else errEl.textContent='No se pudo obtener la ubicación. Intenta de nuevo.';
      nombre='';
    },
    {enableHighAccuracy:true, timeout:15000, maximumAge:0}
  );
}

async function saveLocation(lat,lng){
  const id=nombre.replace(/\s+/g,'_').toLowerCase();
  const ts=new Date().toISOString();
  // Usar UPDATE explícito (no upsert) para que Supabase Realtime dispare correctamente
  const{error:errUpd}=await sb.from('user_locations').update({nombre,lat,lng,updated_at:ts}).eq('id',id);
  if(errUpd){
    // Si no existe aún, hacer INSERT
    await sb.from('user_locations').insert({id,nombre,lat,lng,updated_at:ts});
  }
  const count=(parseInt(localStorage.getItem('gps_count')||'0')+1);
  localStorage.setItem('gps_count',count);
  document.getElementById('display-coords').textContent=`${lat.toFixed(6)}, ${lng.toFixed(6)}`;
  document.getElementById('last-update').textContent=`Actualizado: ${new Date().toLocaleTimeString('es-PE')} (#${count})`;
}

async function testManual(){
  const msg=document.getElementById('test-msg');
  msg.textContent='Probando GPS...';
  navigator.geolocation.getCurrentPosition(
    async(pos)=>{
      const lat=pos.coords.latitude, lng=pos.coords.longitude;
      msg.textContent=`GPS OK: ${lat.toFixed(5)}, ${lng.toFixed(5)} — Enviando...`;
      const id=nombre.replace(/\s+/g,'_').toLowerCase();
      const ts=new Date().toISOString();
      const{error}=await sb.from('user_locations').update({nombre,lat,lng,updated_at:ts}).eq('id',id);
      if(error){
        msg.textContent=`❌ Error Supabase: ${error.message}`;
      } else {
        msg.textContent=`✅ Enviado OK a las ${new Date().toLocaleTimeString('es-PE')}`;
      }
    },
    (err)=>{
      msg.textContent=`❌ GPS error código ${err.code}: ${err.message}`;
    },
    {enableHighAccuracy:true,timeout:10000,maximumAge:0}
  );
}
  nombre=n;
  document.getElementById('login-panel').style.display='none';
  document.getElementById('status-panel').style.display='block';
  document.getElementById('display-nombre').textContent=n;
  document.getElementById('start-btn').disabled=false;
  document.getElementById('start-btn').textContent='Iniciar seguimiento';
  // Activar Wake Lock para mantener pantalla activa y GPS funcionando
  activateWakeLock();
}

let _wakeLock=null;
async function activateWakeLock(){
  const msg=document.getElementById('wakelock-msg');
  if('wakeLock' in navigator){
    try{
      _wakeLock=await navigator.wakeLock.request('screen');
      if(msg) msg.textContent='🔒 Pantalla activa (GPS continuo)';
      // Reactivar si se suspende
      document.addEventListener('visibilitychange',async()=>{
        if(_wakeLock!==null&&document.visibilityState==='visible'){
          try{_wakeLock=await navigator.wakeLock.request('screen');}catch(e){}
        }
      });
    }catch(e){
      if(msg) msg.textContent='⚠ Mantén la pantalla encendida para tracking continuo';
    }
  } else {
    if(msg) msg.textContent='⚠ Mantén la pantalla encendida para tracking continuo';
  }
}

async function stopTracking(){
  if(watchId!==null){navigator.geolocation.clearWatch(watchId);watchId=null;}
  if(fallbackInterval){clearInterval(fallbackInterval);fallbackInterval=null;}
  if(_wakeLock){try{await _wakeLock.release();_wakeLock=null;}catch(e){}}
  const id=nombre.replace(/\s+/g,'_').toLowerCase();
  // Intentar eliminar hasta 3 veces
  for(let i=0;i<3;i++){
    const{error}=await sb.from('user_locations').delete().eq('id',id);
    if(!error) break;
    await new Promise(r=>setTimeout(r,500));
  }
  localStorage.removeItem('tracking_nombre');
  nombre='';
  document.getElementById('status-panel').style.display='none';
  document.getElementById('login-panel').style.display='block';
  document.getElementById('start-btn').disabled=false;
  document.getElementById('start-btn').textContent='Iniciar seguimiento';
  // Refrescar lista para liberar el nombre visualmente
  await refreshOcupados(_lista);
}
</script>
</body>
</html>
