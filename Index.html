   ==========================================

   Actualmente usa localStorage.
   Cuando activemos Firebase, solo cambiaremos
   estas funciones, NO el resto del código.
*/

const StorageService = {

  save(key, value) {
    localStorage.setItem(key, JSON.stringify(value));
  },

  load(key) {
    const data = localStorage.getItem(key);
    return data ? JSON.parse(data) : null;
  },

  remove(key) {
    localStorage.removeItem(key);
  }

};

/* ==========================================
   EJEMPLO DE USO (NO ROMPE NADA)
   ========================================== */

let selectedZone = "LIMA";
let allRecords = StorageService.load("records_" + selectedZone) || [];

/* Simulación básica de guardado */
function saveRecords() {
  StorageService.save("records_" + selectedZone, allRecords);
}
