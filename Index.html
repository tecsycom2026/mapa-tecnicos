<script id="app-script">
// ============================================
// VARIABLES GLOBALES PARA FIREBASE
// ============================================
let firebaseConnected = false;
let db = null;
let auth = null;
let storage = null;
let unsubscribeRecords = null;
let unsubscribeCoords = null;

// Variables globales existentes (SIN CAMBIOS)
let map;
let markers = [];
let allRecords = [];
let techColors = {};
let techImages = {};
let customCoords = [];
let currentRecord = null;
window.currentSuggestions = [];
let alertsEnabled = localStorage.getItem('alertsEnabled') !== 'false';
const saved = localStorage.getItem('techImages');
if (saved) techImages = JSON.parse(saved);
let selectedZone = localStorage.getItem('selectedZone') || 'LIMA';
const savedCoords = localStorage.getItem(`customCoords_${selectedZone}`);
if (savedCoords) customCoords = JSON.parse(savedCoords);
let technicianList = [];
const INTERVALS = [
{ name: '8/12', start: 8, end: 12 },
{ name: '12/16', start: 12, end: 16 },
{ name: '16/20', start: 16, end: 20 }
];
let countdownInterval;

// ============================================
// FUNCIONES DE FIREBASE
// ============================================
async function initializeFirebase() {
  return new Promise((resolve) => {
    const checkInterval = setInterval(() => {
      if (window.firebaseDB && window.firebaseAuth && window.firebaseStorage) {
        clearInterval(checkInterval);
        db = window.firebaseDB;
        auth = window.firebaseAuth;
        storage = window.firebaseStorage;
        firebaseConnected = true;
        updateFirebaseStatus(true);
        console.log('Firebase inicializado y listo');
        resolve(true);
      }
    }, 100);
    
    // Timeout después de 5 segundos
    setTimeout(() => {
      clearInterval(checkInterval);
      if (!firebaseConnected) {
        updateFirebaseStatus(false);
        console.warn('Firebase no disponible, usando solo localStorage');
        resolve(false);
      }
    }, 5000);
  });
}

function updateFirebaseStatus(connected) {
  const statusText = document.getElementById('firebase-status-text');
  const statusDiv = document.getElementById('firebase-status');
  
  if (connected) {
    statusText.textContent = 'Conectado a Firebase';
    statusText.className = 'firebase-connected';
    statusDiv.style.backgroundColor = '#d4edda';
  } else {
    statusText.textContent = 'Modo Offline (localStorage)';
    statusText.className = 'firebase-disconnected';
    statusDiv.style.backgroundColor = '#f8d7da';
  }

// Guardar registros en Firebase
async function saveRecordsToFirebase() {
  if (!firebaseConnected || !db) return false;
  
  try {
    const recordsRef = collection(db, 'shared_data', 'zones', 'records');
    
    // Guardar cada registro con ID como documento
    for (const record of allRecords) {
      const recordRef = doc(recordsRef, String(record.id));
      await setDoc(recordRef, record);
    }
    
    console.log(`✓ Guardados ${allRecords.length} registros en Firebase`);
    return true;
  } catch (error) {
    console.error('✗ Error al guardar registros en Firebase:', error);
    return false;
  }
}

// Cargar registros desde Firebase
async function loadRecordsFromFirebase() {
  if (!firebaseConnected || !db) {
    console.log('Firebase no disponible, usando localStorage');
    return false;
  }
  
  try {
    showLoading(true);
    
    const recordsRef = collection(db, 'shared_data', 'zones', 'records');
    const q = query(recordsRef);
    const querySnapshot = await getDocs(q);
    
    if (querySnapshot.empty) {
      console.log('No hay datos en Firebase, usando localStorage');
      showLoading(false);
      return false;
    }
    
    allRecords = [];
    querySnapshot.forEach((doc) => {
      const record = doc.data();
      // Normalizar campos para búsqueda
      if (record.Cliente) record.ClienteNormalized = normalizeString(record.Cliente);
      if (record.Direccion) record.DireccionNormalized = normalizeString(record.Direccion);
      if (record.Distrito) record.DistritoNormalized = normalizeString(record.Distrito);
      allRecords.push(record);
    });
    
    // Guardar en localStorage para offline
    localStorage.setItem(`records_${selectedZone}`, JSON.stringify(allRecords));
    
    populateFilters();
    renderMarkers();
    updateStatistics();
    showLoading(false);
    
    console.log(`✓ Cargados ${allRecords.length} registros desde Firebase`);
    return true;
  } catch (error) {
    console.error('✗ Error al cargar registros desde Firebase:', error);
    showLoading(false);
    return false;
  }
}

// Escuchar cambios en tiempo real para registros
function setupRealtimeListenerForRecords() {
  if (!firebaseConnected || !db) return;
  
  const recordsRef = collection(db, 'shared_data', 'zones', 'records');
  const q = query(recordsRef);
  
  unsubscribeRecords = onSnapshot(q, (snapshot) => {
    console.log('🔄 Actualización en tiempo real detectada en registros');
    
    const updatedRecords = [];
    snapshot.forEach((doc) => {
      const record = doc.data();
      if (record.Cliente) record.ClienteNormalized = normalizeString(record.Cliente);
      if (record.Direccion) record.DireccionNormalized = normalizeString(record.Direccion);
      if (record.Distrito) record.DistritoNormalized = normalizeString(record.Distrito);
      updatedRecords.push(record);
    });
    
    allRecords = updatedRecords;
    localStorage.setItem(`records_${selectedZone}`, JSON.stringify(allRecords));
    
    // Actualizar UI solo si hay cambios visibles
    populateFilters();
    renderMarkers();
    updateStatistics();
    renderTechnicianSummary();
    
    console.log(`✓ Sincronizados ${allRecords.length} registros`);
  }, (error) => {
    console.error('Error en listener de registros:', error);
  });
}

// Guardar imágenes de técnicos en Firebase Storage
async function saveTechImageToStorage(technicianName, file) {
  if (!firebaseConnected || !storage || !db) return null;
  
  try {
    const storageRef = ref(storage, `tech_images/${technicianName}`);
    await uploadBytes(storageRef, file);
    const downloadURL = await getDownloadURL(storageRef);
    
    // Guardar URL en Firestore
    const techImageRef = doc(db, 'shared_data', 'tech_images');
    const docSnap = await getDoc(techImageRef);
    
    let techImagesData = {};
    if (docSnap.exists()) {
      techImagesData = docSnap.data();

    techImagesData[technicianName] = downloadURL;
    await setDoc(techImageRef, techImagesData);
    
    return downloadURL;
  } catch (error) {
    console.error('✗ Error al guardar imagen en Storage:', error);
    return null;
  }

// Sincronizar manualmente con Firebase
async function manualSync() {
  if (!firebaseConnected) {
    alert('No hay conexión con Firebase. Verifique su conexión a internet.');
    return;
  }
  
  try {
    showLoading(true);
    document.getElementById('sync-btn').disabled = true;
    
    // Guardar datos locales en Firebase
    await saveRecordsToFirebase();
    await saveCustomCoordsToFirebase();
    
    // Recargar desde Firebase para asegurar sincronización
    await loadRecordsFromFirebase();
    await loadCustomCoordsFromFirebase();
    await loadTechImagesFromFirebase();
    
    showLoading(false);
    document.getElementById('sync-btn').disabled = false;
    
    alert('✓ Sincronización completada exitosamente');
  } catch (error) {
    console.error('Error en sincronización:', error);
    showLoading(false);
    document.getElementById('sync-btn').disabled = false;
    alert('✗ Error en la sincronización: ' + error.message);
  }
}

function normalizeString(str) {
if (!str) return "";
return str.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
}

function deleteRecord(recordId) {
  showLoading(true);
  setTimeout(async () => {
    const isManualCoord = customCoords.some(c => c.id === recordId);
    
    if (isManualCoord) {
      customCoords = customCoords.filter(c => c.id !== recordId);
      localStorage.setItem(`customCoords_${selectedZone}`, JSON.stringify(customCoords));
      
      // Eliminar de Firebase si está conectado
      if (firebaseConnected && db) {
        try {
          const coordRef = doc(db, 'shared_data', 'zones', 'custom_coords', String(recordId));
          await deleteDoc(coordRef);
          console.log(`✓ Coordenada ${recordId} eliminada de Firebase`);
        } catch (error) {
          console.error('Error al eliminar coordenada de Firebase:', error);
        }
      }
      
      renderCustomCoordsList();
    } else {
      allRecords = allRecords.filter(r => r.id !== recordId);
      localStorage.setItem(`records_${selectedZone}`, JSON.stringify(allRecords));
      
      // Eliminar de Firebase si está conectado
      if (firebaseConnected && db) {
        try {
          const recordRef = doc(db, 'shared_data', 'zones', 'records', String(recordId));
          await deleteDoc(recordRef);
          console.log(`✓ Registro ${recordId} eliminado de Firebase`);
        } catch (error) {
          console.error('Error al eliminar registro de Firebase:', error);
        }
      }
      
      populateFilters();
    }
    
    document.getElementById('detail-panel').classList.remove('open');
    renderMarkers();
    updateStatistics();
    showLoading(false);
    alert("Registro eliminado correctamente");
  }, 500);
}

// ... (RESTO DE LAS FUNCIONES EXISTENTES SIN CAMBIOS HASTA handleExcelUpload) ...

function handleExcelUpload(e) {
  const file = e.target.files[0];
  if (!file) return;
  showLoading(true);
  const reader = new FileReader();
  reader.onload = async function (evt) {
    const data = new Uint8Array(evt.target.result);
    const wb = XLSX.read(data, { type: 'array' });
    const sheet = wb.Sheets[wb.SheetNames[0]];
    const json = XLSX.utils.sheet_to_json(sheet, { defval: '' });
    const newRecords = [];
    const coordMap = new Map();
    json.forEach(row => {
      const lat = parseFloat(row.latitud_Y), lng = parseFloat(row.longitud_X);
      if (isNaN(lat) || isNaN(lng)) return;
      const key = `${lat},${lng}`;
      if (coordMap.has(key)) return;
      coordMap.set(key, true);
      newRecords.push({ 
        id: row.id || row.ID || row.Codigo || Date.now() + Math.random(), 
        Codigo: row.Codigo, 
        Cliente: row.Cliente, 
        Direccion: row.Direccion, 
        longitud_X: lng, 
        latitud_Y: lat, 
        Ubicacion: row.Ubicacion, 
        Location: row.Location || '', 
        Distrito: row.Distrito, 
        Tecnico: row.Tecnico, 
        Estado: row.Estado, 
        Observaciones: row.Observaciones, 
        Estado2: row.Estado2, 
        Tramo: row.Tramo, 
        Negocio: row.Negocio 
      });
    });
    allRecords = newRecords;
    localStorage.setItem(`records_${selectedZone}`, JSON.stringify(allRecords));
    
    // Guardar en Firebase
    if (firebaseConnected) {
      await saveRecordsToFirebase();
    }
    
    populateFilters();
    renderMarkers();
    updateStatistics();
    showLoading(false);
    e.target.value = '';
  };
  reader.readAsArrayBuffer(file);
}

// ... (RESTO DE LAS FUNCIONES EXISTENTES SIN CAMBIOS HASTA handleTechImageUpload) ...

function handleTechImageUpload(e) {
  const file = e.target.files[0];
  const tecnico = document.getElementById('image-tecnico-select').value;
  if (!file || !tecnico) {
    alert("Debe seleccionar un técnico y una imagen");
    e.target.value = '';
    return;
  }
  
  // Subir a Firebase Storage si está disponible
  if (firebaseConnected) {
    saveTechImageToStorage(tecnico, file).then(downloadURL => {
      if (downloadURL) {
        techImages[tecnico] = downloadURL;
        localStorage.setItem('techImages', JSON.stringify(techImages));
        renderMarkers();
        alert(`Imagen asignada al técnico "${tecnico}" correctamente`);
      } else {
        alert("Error al subir la imagen");
      }
      e.target.value = '';
    }).catch(error => {
      console.error('Error:', error);
      alert("Error al subir la imagen");
      e.target.value = '';
    });
  } else {
    // Si no hay Firebase, usar método local
    const reader = new FileReader();
    reader.onload = function (evt) {
      techImages[tecnico] = evt.target.result;
      localStorage.setItem('techImages', JSON.stringify(techImages));
      renderMarkers();
      alert(`Imagen asignada al técnico "${tecnico}" correctamente`);
      e.target.value = '';
    };
    reader.readAsDataURL(file);
  }
}

// ... (RESTO DE LAS FUNCIONES EXISTENTES SIN CAMBIOS HASTA saveAndRenderCoord) ...

function saveAndRenderCoord(entry) {
  entry.zone = selectedZone;
  const mergedMap = new Map();
  customCoords.forEach(c => {
    const key = `${c.lat},${c.lng},${c.zone}`;
    mergedMap.set(key, c);
  });
  const keyNew = `${entry.lat},${entry.lng},${entry.zone}`;
  const existing = mergedMap.get(keyNew);
  if (existing && existing.imgData && !entry.imgData) {
    entry.imgData = existing.imgData;
  }
  mergedMap.set(keyNew, entry);
  customCoords = Array.from(mergedMap.values());
  localStorage.setItem(`customCoords_${selectedZone}`, JSON.stringify(customCoords));
  
  // Guardar en Firebase
  if (firebaseConnected) {
    saveCustomCoordsToFirebase();
  }
  
  renderCustomCoordsList();
  updateCategoryCheckboxes();
  renderMarkers();
  ['coord-input', 'coord-category', 'coord-note', 'coord-image'].forEach(id => document.getElementById(id).value = '');
  alert('Coordenada guardada correctamente');
}
