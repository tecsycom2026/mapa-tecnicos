<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tecsycom</title>
  <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/1865/1865269.png" type="image/x-icon">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style id="app-style">
    html, body { height:100%; margin:0; padding:0; overflow:hidden; }
    #app-container { display:flex; height:100vh; width:100%; }
    #sidebar { width:300px; height:100%; background-color:#f8f9fa; overflow-y:auto; transition:transform .3s ease; z-index:1000; box-shadow:2px 0 5px rgba(0,0,0,.1); }
    #sidebar.collapsed { transform:translateX(-280px); }
    #toggle-sidebar { position:absolute; left:300px; top:10px; z-index:1001; transition:left .3s ease; background-color:#fff; border-radius:0 4px 4px 0; box-shadow:2px 0 5px rgba(0,0,0,.1); }
    #toggle-sidebar.collapsed { left:20px; }
    #map-container { flex-grow:1; position:relative; height:100%; }
    #map { height:100%; width:100%; }
    #detail-panel { position:absolute; right:-400px; top:0; width:380px; height:100%; background-color:#fff; z-index:1000; box-shadow:-2px 0 5px rgba(0,0,0,.1); overflow-y:auto; transition:right .3s ease; padding:15px; }
    #detail-panel.open { right:0; }
    .close-panel { position:absolute; top:10px; right:10px; cursor:pointer; }
    .accordion-button:not(.collapsed) { background-color:#e7f1ff; color:#0c63e4; }
    .loading-overlay { position:absolute; top:0; left:0; width:100%; height:100%; background-color:rgba(255,255,255,.8); display:flex; justify-content:center; align-items:center; z-index:2000; }
    .custom-pin { width:30px; height:30px; border-radius:50%; background:var(--color,#4285F4); color:#fff; display:flex; align-items:center; justify-content:center; font-size:1.5em; box-shadow:0 2px 8px rgba(0,0,0,.15); }
    .filter-section { padding:10px; margin-bottom:10px; border-bottom:1px solid #dee2e6; }
    .clear-filters { margin-top:10px; }
    #style-legend { position:absolute; bottom:20px; right:10px; z-index:1001; }
    #style-legend .dropdown-menu { min-width:160px; }
    #collapseThree .accordion-body { background-color:#fff8e1; border:1px solid #ffecb3; }
    #collapseThree .form-select,#collapseThree .form-control-sm { border-color:#ffa000; box-shadow:0 0 5px rgba(255,160,0,.5); }
    .assign-category-image-btn { margin-left:.5rem; padding:.25rem .5rem; font-size:.9em; }
    .visually-hidden { position:absolute!important; width:1px!important; height:1px!important; padding:0!important; margin:-1px!important; overflow:hidden!important; clip:rect(0,0,0,0)!important; border:0!important; }
    #kml-upload { position:absolute; top:0; left:0; width:100%; height:100%; opacity:0; cursor:pointer; }
    @keyframes glow { 0%{box-shadow:0 0 5px rgba(255,0,0,.8)} 50%{box-shadow:0 0 20px rgba(255,0,0,1)} 100%{box-shadow:0 0 5px rgba(255,0,0,.8)} }
    .glow { animation:glow 1s ease-in-out alternate 3; }
    #coord-list { display:none; }
    .estado-label { background:transparent; border:none; padding:2px 5px; font-size:11px; white-space:nowrap; margin-left:20px; text-align:center; pointer-events:none; box-shadow:none; }
    .custom-marker-container { display:flex; align-items:center; flex-direction:row; }
    .estado-en-camino { color:black!important; background-color:yellow!important; }
    .estado-pendiente { font-weight:bold; color:black!important; background-color:yellow!important; border:none!important; box-shadow:none!important; }
    .countdown-overlay { position:absolute; top:0; left:0; width:100%; background:rgba(255,255,0,.7)!important; color:black!important; font-weight:bold; text-align:center; z-index:10; pointer-events:none; }
    .countdown-expired .custom-pin { background:#FF0000!important; }
    #global-timer-overlay { position:absolute; top:10px; right:50%; transform:translateX(50%); background:rgba(255,255,0,.8)!important; color:black!important; padding:5px 10px; border-radius:5px; z-index:1500; }
    @media(max-width:768px){ #sidebar{width:100%;transform:translateX(-100%)} #toggle-sidebar.collapsed{left:10px} #detail-panel{width:100%} }
    .bg-yellow { background-color:yellow; }
    .highlight-pendiente-8-12,.highlight-pendiente-12-16,.highlight-pendiente-16-20 { background-color:yellow!important; color:black!important; }
    .bg-warning,.badge.bg-warning { background-color:yellow!important; color:black!important; }
    .alert-danger { background-color:yellow!important; color:black!important; border-color:yellow!important; }
    .tech-suggested-highlight { font-weight:bold; background-color:#ffeeba; border-radius:3px; padding:2px 4px; }
    .context-menu { position:absolute; display:none; background-color:#fff; border:1px solid #ccc; border-radius:4px; box-shadow:0 2px 5px rgba(0,0,0,.2); padding:8px 0; z-index:2000; min-width:200px; max-height:300px; overflow-y:auto; }
    .context-menu-item { padding:8px 12px; cursor:pointer; font-size:14px; white-space:nowrap; }
    .context-menu-item:hover { background-color:#f0f0f0; }
    .context-menu-separator { border-top:1px solid #e0e0e0; margin:4px 0; }
    .context-menu-header { font-weight:bold; padding:8px 12px; background-color:#f5f5f5; border-bottom:1px solid #e0e0e0; }
    .context-menu-input { margin:8px 12px; width:calc(100% - 24px); }
    .context-menu-add-btn { margin:0 12px 8px; width:calc(100% - 24px); }
    #realtime-indicator { position:absolute; top:10px; left:50%; transform:translateX(-50%); z-index:1500; background:rgba(0,150,0,.85); color:#fff; font-size:12px; padding:5px 14px; border-radius:20px; display:none; white-space:nowrap; pointer-events:none; transition:opacity .5s; }
    #realtime-indicator.show { display:block; }
    #realtime-indicator.fade-out { opacity:0; }
    #sidebar-style-legend li { cursor:pointer; padding:4px 8px; border-radius:4px; }
    #sidebar-style-legend li.active { background:#0d6efd; color:#fff; }
    @keyframes arrowBounce { 0%{transform:translateX(-50%) translateY(0)} 100%{transform:translateX(-50%) translateY(-4px)} }
  </style>
</head>
<body>
<div id="app-container">
  <div id="sidebar">
    <div class="p-3">
      <h4 class="mb-3"><i class="fas fa-map"></i> Michell Sulca.V</h4>
      <div id="auth-status" class="mb-2">
        <span class="badge bg-success"><i class="fas fa-cloud"></i> Supabase – tiempo real</span>
      </div>
      <div id="no-tech-summary" class="mb-3 text-muted"></div>
      <div id="manual-coords-list" class="mb-4">
        <div class="mb-2">
          <h6>Coordenadas Agregadas</h6>
          <div id="category-checkboxes" class="mt-2"></div>
        </div>
        <ul class="list-group list-group-sm" id="coord-list"></ul>
      </div>

      <div class="accordion" id="accordionSidebar">
        <div class="accordion-item">
          <h2 class="accordion-header">
            <button class="accordion-button" type="button" data-bs-toggle="collapse" data-bs-target="#collapseOne">Filtros</button>
          </h2>
          <div id="collapseOne" class="accordion-collapse collapse show">
            <div class="accordion-body">
              <div class="filter-section">
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" id="show-tooltips" checked>
                  <label class="form-check-label" for="show-tooltips">Mostrar Estado</label>
                </div>
              </div>
              <div class="filter-section">
                <label class="form-label">Filtrar por Tramo:</label>
                <select id="tramo-filter" class="form-select mb-2"><option value="">Todos los tramos</option></select>
              </div>
              <div class="filter-section">
                <label class="form-label">Filtrar por Estado:</label>
                <select id="estado-filter" class="form-select mb-2"><option value="">Todos los estados</option></select>
              </div>
              <div class="filter-section">
                <label class="form-label">Filtrar por Distrito:</label>
                <select id="distrito-filter" class="form-select mb-2"><option value="">Todos los distritos</option></select>
              </div>
              <div class="filter-section">
                <label class="form-label">Filtrar por Técnico:</label>
                <select id="tecnico-filter" class="form-select mb-2"><option value="">Todos los técnicos</option></select>
              </div>
              <div class="filter-section">
                <label class="form-label">Filtrar por Negocio:</label>
                <select id="negocio-filter" class="form-select mb-2"><option value="">Todos los negocios</option></select>
              </div>
              <div id="pending-format-section" class="filter-section">
                <div class="mb-2">Formato Pendientes:</div>
                <div class="form-check form-switch"><input class="form-check-input" type="checkbox" id="format-8-12"><label class="form-check-label" for="format-8-12">Pendiente 8/12</label></div>
                <div class="form-check form-switch"><input class="form-check-input" type="checkbox" id="format-12-16"><label class="form-check-label" for="format-12-16">Pendiente 12/16</label></div>
                <div class="form-check form-switch"><input class="form-check-input" type="checkbox" id="format-16-20"><label class="form-check-label" for="format-16-20">Pendiente 16/20</label></div>
              </div>
              <button id="clear-filters" class="btn btn-outline-secondary btn-sm">Limpiar filtros</button>

              <div class="mb-4 p-3 border rounded bg-light mt-3">
                <label class="form-label">Buscar por Código</label>
                <div class="input-group input-group-sm">
                  <input type="text" id="codigo-search" class="form-control" placeholder="Ingrese Código exacto">
                  <button id="search-codigo-btn" class="btn btn-primary">Buscar</button>
                </div>
                <div id="codigo-search-msg" class="text-danger small mt-1"></div>
              </div>

              <div id="coord-entry" class="mb-4 p-3 border rounded bg-light">
                <h6>Agregar Coordenada</h6>
                <div class="mb-2"><label class="form-label">Ubicación (lat,lng)</label><input type="text" id="coord-input" class="form-control form-control-sm" placeholder="-12.04, -77.03"></div>
                <div class="mb-2"><label class="form-label">Categoría</label>
                  <select id="coord-category" class="form-select form-select-sm">
                    <option value="">Seleccione...</option>
                    <option value="Zona sin Cobertura">Zona sin Cobertura</option>
                    <option value="Sin FFTT">Sin FFTT</option>
                    <option value="Zona Peligrosa">Zona Peligrosa</option>
                    <option value="Dirección de Técnicos">Dirección de Técnicos</option>
                  </select>
                </div>
                <div class="mb-2"><label class="form-label">Imagen (jpg/png)</label><input type="file" id="coord-image" accept=".jpg,.png" class="form-control form-control-sm"></div>
                <div class="mb-2"><label class="form-label">Nota (opcional)</label><input type="text" id="coord-note" class="form-control form-control-sm"></div>
                <button id="save-coord" class="btn btn-primary btn-sm w-100">Guardar Coordenada</button>
              </div>

              <div class="mb-3 mt-3">
                <label class="form-label">Zonal:</label>
                <div>
                  <div class="form-check form-check-inline"><input class="form-check-input" type="radio" name="zoneSelector" id="zone-lima" value="LIMA" checked><label class="form-check-label" for="zone-lima">LIMA</label></div>
                  <div class="form-check form-check-inline"><input class="form-check-input" type="radio" name="zoneSelector" id="zone-provincia" value="PROVINCIA"><label class="form-check-label" for="zone-provincia">PROVINCIA</label></div>
                </div>
              </div>

              <div class="filter-section">
                <label class="form-label">Cargar archivo .xlsx:</label>
                <div class="input-group">
                  <input type="file" id="excel-upload" accept=".xlsx" class="visually-hidden" />
                  <label for="excel-upload" class="btn btn-outline-primary btn-sm">Subir Archivo Maps</label>
                </div>
              </div>

              <div class="filter-section mt-3">
                <label class="form-label">Cargar archivo KML:</label>
                <div class="input-group">
                  <label class="btn btn-outline-primary btn-sm position-relative overflow-hidden">
                    Subir KML
                    <input type="file" id="kml-upload" accept=".kml" class="visually-hidden" />
                  </label>
                </div>
                <div id="kml-upload-msg" class="small mt-1"></div>
                <div class="form-check mt-2"><input class="form-check-input" type="checkbox" id="show-kml-points"><label class="form-check-label" for="show-kml-points">Mostrar Técnicos KML</label></div>
              </div>
            </div>
          </div>
        </div>

        <div class="accordion-item">
          <h2 class="accordion-header">
            <button class="accordion-button" type="button" data-bs-toggle="collapse" data-bs-target="#collapseTwo">Estadísticas</button>
          </h2>
          <div id="collapseTwo" class="accordion-collapse collapse show">
            <div class="accordion-body">
              <div class="mb-3"><h6>Leyenda de Estilos de Mapa:</h6><ul id="sidebar-style-legend" class="list-unstyled"></ul></div>
            </div>
          </div>
        </div>

        <div class="accordion-item">
          <h2 class="accordion-header">
            <button class="accordion-button" type="button" data-bs-toggle="collapse" data-bs-target="#collapseThree">Asignar Imagen a Técnico</button>
          </h2>
          <div id="collapseThree" class="accordion-collapse collapse show">
            <div class="accordion-body">
              <div class="mb-2"><label class="form-label">Técnico:</label><select id="image-tecnico-select" class="form-select"><option value="">Selecciona técnico</option></select></div>
              <div><label class="form-label">Subir imagen (JPG/PNG):</label>
                <div class="input-group"><input type="file" id="tech-image-upload" accept=".png,.jpg,.jpeg" class="visually-hidden" /><label for="tech-image-upload" class="btn btn-outline-primary btn-sm">Subir</label></div>
              </div>
            </div>
          </div>
        </div>

        <div id="tech-summary-panel" class="mb-4 p-3 border rounded bg-light mt-3">
          <h6>Resumen por Técnico</h6>
          <div id="tech-summary-content" class="small"><div class="text-center text-muted">Cargando...</div></div>
        </div>
      </div>
    </div>
  </div>

  <button id="toggle-sidebar" class="btn btn-sm btn-light"><i class="fas fa-bars"></i></button>

  <div id="map-container">
    <div id="map"></div>
    <div id="realtime-indicator"><i class="fas fa-sync-alt fa-spin me-1"></i> Mapa actualizado en tiempo real</div>
    <div id="detail-panel">
      <span class="close-panel" id="close-detail"><i class="fas fa-times"></i></span>
      <div id="record-details"></div>
      <button id="delete-record" class="btn btn-danger mt-3">Eliminar registro</button>
    </div>
    <div class="loading-overlay" id="loading-overlay">
      <div class="spinner-border text-primary" role="status"><span class="visually-hidden">Cargando...</span></div>
    </div>
    <div class="dropdown" id="style-legend">
      <button class="btn btn-light dropdown-toggle" type="button" data-bs-toggle="dropdown"><span id="current-style-label">CartoDB Positron</span></button>
      <ul class="dropdown-menu"></ul>
    </div>
  </div>
</div>
<div id="context-menu" class="context-menu"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<script>
// ─── Supabase config ──────────────────────────────────────────────────────────
const SUPABASE_URL = 'https://jxpeztieqwotfgswhzhx.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp4cGV6dGllcXdvdGZnc3doemh4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA4MzQ4MDQsImV4cCI6MjA4NjQxMDgwNH0.Hf-lbGlP2OmH7Uh2LNKqwHkwHDp7yQV6O73aXw5NCZk';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// ─── Supabase helpers ─────────────────────────────────────────────────────────
async function sbSave(table, zone, data) {
  const { error } = await sb.from(table).upsert({ id: zone, zone, data, updated_at: new Date().toISOString() });
  if (error) console.error(`sbSave ${table}:`, error);
}
async function sbLoad(table, zone) {
  const { data, error } = await sb.from(table).select('data').eq('id', zone).single();
  if (error) return null;
  return data?.data ?? null;
}
async function sbSaveGlobal(table, data) {
  const { error } = await sb.from(table).upsert({ id: 'global', data, updated_at: new Date().toISOString() });
  if (error) console.error(`sbSaveGlobal ${table}:`, error);
}
async function sbLoadGlobal(table) {
  const { data, error } = await sb.from(table).select('data').eq('id', 'global').single();
  if (error) return null;
  return data?.data ?? null;
}

// ─── Realtime subscriptions ───────────────────────────────────────────────────
let _realtimeChannel = null;

function subscribeToZone(zone) {
  if (_realtimeChannel) { sb.removeChannel(_realtimeChannel); _realtimeChannel = null; }

  _realtimeChannel = sb.channel(`zone_${zone}`)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'records', filter: `id=eq.${zone}` }, payload => {
      const incoming = payload.new?.data;
      if (!incoming) return;
      allRecords = Array.isArray(incoming) ? incoming : Object.values(incoming);
      localStorage.setItem(`records_${zone}`, JSON.stringify(allRecords));
      populateFilters(); renderMarkers(); updateStatistics();
      flashRealtimeIndicator('Registros actualizados');
    })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'coords', filter: `id=eq.${zone}` }, payload => {
      const incoming = payload.new?.data;
      if (!incoming) return;
      customCoords = Array.isArray(incoming) ? incoming : Object.values(incoming);
      localStorage.setItem(`customCoords_${zone}`, JSON.stringify(customCoords));
      renderCustomCoordsList(); updateCategoryCheckboxes(); renderMarkers();
      flashRealtimeIndicator('Coordenadas actualizadas');
    })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'tech_images', filter: `id=eq.global` }, payload => {
      const incoming = payload.new?.data;
      if (!incoming) return;
      techImages = incoming;
      localStorage.setItem('techImages', JSON.stringify(techImages));
      renderMarkers();
      flashRealtimeIndicator('Imágenes actualizadas');
    })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'technician_list', filter: `id=eq.global` }, payload => {
      const incoming = payload.new?.data;
      if (!incoming) return;
      // ── Siempre actualiza desde Supabase, nunca desde localStorage ──
      technicianList = Array.isArray(incoming) ? incoming : Object.values(incoming);
      localStorage.setItem('technicianList', JSON.stringify(technicianList));
      flashRealtimeIndicator('Lista de técnicos actualizada');
    })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'category_images', filter: `id=eq.global` }, payload => {
      const incoming = payload.new?.data;
      if (!incoming) return;
      categoryImages = incoming;
      localStorage.setItem('categoryImages', JSON.stringify(categoryImages));
      renderMarkers();
      flashRealtimeIndicator('Imágenes de categorías actualizadas');
    })
    .subscribe();
}

// ─── Realtime indicator ───────────────────────────────────────────────────────
let _fadeTimer = null;
function flashRealtimeIndicator(msg) {
  const el = document.getElementById('realtime-indicator'); if (!el) return;
  if (_fadeTimer) clearTimeout(_fadeTimer);
  el.classList.remove('fade-out');
  el.classList.add('show');
  el.innerHTML = `<i class="fas fa-sync-alt fa-spin me-1"></i> ${msg}`;
  _fadeTimer = setTimeout(() => {
    el.classList.add('fade-out');
    setTimeout(() => el.classList.remove('show', 'fade-out'), 600);
  }, 3000);
}

// ─── Globals ──────────────────────────────────────────────────────────────────
let map, markers = [], allRecords = [], techColors = {}, techImages = {}, customCoords = [];
let currentRecord = null, technicianList = [], countdownInterval = null;
window.currentSuggestions = [];
let alertsEnabled = localStorage.getItem('alertsEnabled') !== 'false';
let selectedZone = localStorage.getItem('selectedZone') || 'LIMA';
const INTERVALS = [{name:'8/12',start:8,end:12},{name:'12/16',start:12,end:16},{name:'16/20',start:16,end:20}];

const savedTI = localStorage.getItem('techImages');
if (savedTI) techImages = JSON.parse(savedTI);
const savedCC = localStorage.getItem(`customCoords_${selectedZone}`);
if (savedCC) customCoords = JSON.parse(savedCC);
let categoryImages = {}; // { "Zona sin Cobertura-LIMA": "base64...", ... }
const savedCI = localStorage.getItem('categoryImages');
if (savedCI) categoryImages = JSON.parse(savedCI);

function normalizeString(s) { return s ? s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase() : ''; }
function showLoading(v) { document.getElementById('loading-overlay').style.display = v ? 'flex' : 'none'; }

// ─── Init ─────────────────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', async () => {
  selectedZone = localStorage.getItem('selectedZone') || 'LIMA';
  document.getElementById(`zone-${selectedZone.toLowerCase()}`).checked = true;

  if (Notification.permission !== 'granted' && Notification.permission !== 'denied')
    Notification.requestPermission();

  document.querySelectorAll('input[name="zoneSelector"]').forEach(r => {
    r.addEventListener('change', function() {
      if (!this.checked) return;
      selectedZone = this.value;
      localStorage.setItem('selectedZone', selectedZone);
      updateCheckboxVisibility();
      showLoading(true);
      loadZoneData(selectedZone);
    });
  });

  initMap();
  setupEventListeners();
  setupStyleLegend();
  setupCoordForm();

  ['format-8-12','format-12-16','format-16-20'].forEach(id => {
    const el = document.getElementById(id); if (!el) return;
    el.checked = localStorage.getItem(id) === 'true';
    updateFormatToggleLabel(el);
    el.addEventListener('change', function() { localStorage.setItem(id, this.checked); updateFormatToggleLabel(this); renderMarkers(); });
  });

  const showKml = document.getElementById('show-kml-points');
  if (showKml) showKml.checked = localStorage.getItem('showKmlPoints') === 'true';

  if (!localStorage.getItem('deletedRecordsByCategory'))
    localStorage.setItem('deletedRecordsByCategory', JSON.stringify({}));

  // ── Cargar imágenes técnicos ──────────────────────────────────────────────
  const fbTI = await sbLoadGlobal('tech_images');
  if (fbTI) { techImages = fbTI; localStorage.setItem('techImages', JSON.stringify(techImages)); }

  // ── Cargar imágenes por categoría ─────────────────────────────────────────
  const fbCI = await sbLoadGlobal('tech_images');
  const fbCatImg = await sbLoadGlobal('category_images');
  if (fbCatImg) { categoryImages = fbCatImg; localStorage.setItem('categoryImages', JSON.stringify(categoryImages)); }

  // ── Cargar lista de técnicos SIEMPRE desde Supabase (nunca localStorage) ──
  localStorage.removeItem('technicianList'); // limpiar cache local siempre
  const fbTL = await sbLoadGlobal('technician_list');
  if (Array.isArray(fbTL) && fbTL.length > 0) {

// ─── Load zone data ───────────────────────────────────────────────────────────
async function loadZoneData(zone) {
  try {
    const [recData, coordData] = await Promise.all([
      sbLoad('records', zone),
      sbLoad('coords',  zone)
    ]);

    // Si Supabase tiene datos usarlos, si no usar localStorage como fallback
    if(recData !== null){
      allRecords = Array.isArray(recData) ? recData : Object.values(recData);
      localStorage.setItem(`records_${zone}`, JSON.stringify(allRecords));
    } else {
      const local = localStorage.getItem(`records_${zone}`);
      allRecords = local ? JSON.parse(local) : [];
    }

    if(coordData !== null){
      customCoords = Array.isArray(coordData) ? coordData : Object.values(coordData);
      localStorage.setItem(`customCoords_${zone}`, JSON.stringify(customCoords));
    } else {
      const local = localStorage.getItem(`customCoords_${zone}`);
      customCoords = local ? JSON.parse(local) : [];
    }

    // Reset zoom para que fitBounds muestre los datos de la zona nueva
    window._userHasZoomed = false;

    populateFilters(); renderMarkers(); updateStatistics();
    renderCustomCoordsList(); updateCategoryCheckboxes();
    showLoading(false);
    subscribeToZone(zone);
  } catch(e) {
    console.error('loadZoneData error:', e);
    // Fallback a localStorage si Supabase falla
    const localRec = localStorage.getItem(`records_${zone}`);
    const localCoord = localStorage.getItem(`customCoords_${zone}`);
    allRecords   = localRec   ? JSON.parse(localRec)   : [];
    customCoords = localCoord ? JSON.parse(localCoord) : [];
    window._userHasZoomed = false;
    populateFilters(); renderMarkers(); updateStatistics();
    renderCustomCoordsList(); updateCategoryCheckboxes();
    showLoading(false);
  }
}

// ─── Filters ──────────────────────────────────────────────────────────────────
function populateFilters() {
  ['tramo-filter','estado-filter','tecnico-filter','negocio-filter','distrito-filter'].forEach(id => {
    const el = document.getElementById(id); if (!el) return;
    el.innerHTML = el.options[0].outerHTML;
  });
  const tramos   = [...new Set(allRecords.map(r=>r.Tramo).filter(Boolean))].sort();
  const estados  = [...new Set(allRecords.map(r=>r.Estado2).filter(Boolean))].sort();
  const tecnicos = [...new Set(allRecords.map(r=>r.Tecnico).filter(Boolean))].sort();
  const negocios = [...new Set(allRecords.map(r=>r.Negocio).filter(Boolean))].sort();
  const distMap  = new Map();
  allRecords.forEach(r => { if(r.Distrito){const n=normalizeString(r.Distrito);if(!distMap.has(n))distMap.set(n,r.Distrito);}});
  const distritos = Array.from(distMap.values()).sort();
  const tf=document.getElementById('tramo-filter'), ef=document.getElementById('estado-filter'),
        tecf=document.getElementById('tecnico-filter'), nf=document.getElementById('negocio-filter'),
        df=document.getElementById('distrito-filter');
  tramos.forEach(t    => tf.insertAdjacentHTML('beforeend',   `<option value="${t}">${t}</option>`));
  distritos.forEach(d => df.insertAdjacentHTML('beforeend',   `<option value="${d}">${d}</option>`));
  ef.insertAdjacentHTML('beforeend','<option value="pendiente_combinado">PENDIENTE</option>');
  estados.forEach(e   => ef.insertAdjacentHTML('beforeend',   `<option value="${e}">${e}</option>`));
  tecnicos.forEach(t  => tecf.insertAdjacentHTML('beforeend', `<option value="${t}">${t}</option>`));
  tecf.insertAdjacentHTML('beforeend','<option value="sin_tecnico">Sin técnico</option>');
  negocios.forEach(n  => nf.insertAdjacentHTML('beforeend',   `<option value="${n}">${n}</option>`));
  const imgSel = document.getElementById('image-tecnico-select');
  if (imgSel) {
    imgSel.innerHTML = '<option value="">Selecciona técnico</option><option value="sin_tecnico">Sin técnico</option>';
    tecnicos.forEach(t => imgSel.insertAdjacentHTML('beforeend', `<option value="${t}">${t}</option>`));
  }
  renderTechnicianSummary();
}

function applyFilters() {
  const t=document.getElementById('tramo-filter')?.value, e=document.getElementById('estado-filter')?.value,
        tech=document.getElementById('tecnico-filter')?.value, neg=document.getElementById('negocio-filter')?.value,
        dist=document.getElementById('distrito-filter')?.value;
  clearMarkers();
  let f=allRecords;
  if(t) f=f.filter(r=>r.Tramo===t);
  if(e){ if(e==='pendiente_combinado') f=f.filter(r=>['PROGRAMADO','EN CAMINO','COORDINADO'].includes(r.Estado2)); else f=f.filter(r=>r.Estado2===e); }
  if(tech) f=f.filter(r=>tech==='sin_tecnico'?!r.Tecnico:r.Tecnico===tech);
  if(neg)  f=f.filter(r=>r.Negocio===neg);
  if(dist){const nd=normalizeString(dist);f=f.filter(r=>normalizeString(r.Distrito)===nd);}
  renderMarkersFromRecords(f);
  // Solo hacer fitBounds si hay filtros activos, sino preservar zoom
  if(markers.length>0 && (t||e||tech||neg||dist)){
    window._userHasZoomed = false;
    map.fitBounds(new L.featureGroup(markers).getBounds(),{padding:[50,50]});
  }
}

function renderMarkers() {
  const currentZoom = map.getZoom();
  const currentCenter = map.getCenter();
  clearMarkers();
  renderMarkersFromRecords(allRecords);
  // Solo hacer fitBounds si no hay zoom previo del usuario
  if(!window._userHasZoomed){
    if(markers.length>0) map.fitBounds(new L.featureGroup(markers).getBounds(),{padding:[50,50]});
  } else {
    map.setView(currentCenter, currentZoom, {animate:false});
  }
}

function renderMarkersFromRecords(records) {
  clearMarkers();
  const colors=['#4285F4','#EA4335','#FBBC05','#34A853','#8E24AA'];
  [...new Set(records.map(r=>r.Tecnico).filter(Boolean))].forEach((t,i)=>{if(!techColors[t])techColors[t]=colors[i%colors.length];});
  techColors['sin_tecnico']='#9E9E9E';
  const showTips=localStorage.getItem('showTooltips')!=='false';
  const visCat={};
  document.querySelectorAll('#category-checkboxes input[type="checkbox"]:checked').forEach(cb=>{
    const z=cb.dataset.zone;if(!visCat[z])visCat[z]=[];visCat[z].push(cb.dataset.category);
  });
  records.forEach(record=>{
    const lat=record.latitud_Y,lng=record.longitud_X;if(!lat||!lng)return;
    const estado=record.Estado||'N/A';
    const color=record.Tecnico&&techColors[record.Tecnico]?techColors[record.Tecnico]:techColors['sin_tecnico'];
    const imgSrc=record.Tecnico?techImages[record.Tecnico]:techImages['sin_tecnico'];

    // Detectar si tiene pendiente con tramo
    const matchTramo=estado.match(/(8\/12|12\/16|16\/20)/);
    const esPendiente=matchTramo&&/(pendiente|coord)/i.test(estado);
    const iv=esPendiente?getIntervalFromRange(matchTramo[1]):null;
    const now=new Date();
    const nowSegs=now.getHours()*3600+now.getMinutes()*60+now.getSeconds();
    const venceSegs=iv?iv.end*3600:null;
    const alertaSegs=venceSegs?venceSegs-3600:null;
    const yaVencio=venceSegs&&nowSegs>=venceSegs;
    const enAlerta=alertaSegs&&nowSegs>=alertaSegs&&nowSegs<venceSegs;

    // Flecha ↓ solo para pins sin técnico asignado
    const sinTecnico=!record.Tecnico;
    const flechaHtml=sinTecnico?`<div style="position:absolute;top:-18px;left:50%;transform:translateX(-50%);font-size:14px;line-height:1;z-index:9998;pointer-events:none;filter:drop-shadow(0 1px 1px rgba(0,0,0,0.5));animation:arrowBounce 1s ease-in-out infinite alternate;">▼</div>`:'';

    let marker;
    if(imgSrc){
      const wrapId=`mw-${Date.now()}-${Math.random().toString(36).slice(2)}`;
      let overlayHtml='';
      if(yaVencio) overlayHtml=`<div class="countdown-overlay" style="display:block;background:rgba(200,0,0,0.90);color:white;font-weight:bold;position:absolute;top:-14px;left:0;width:100%;text-align:center;font-size:10px;padding:1px;z-index:10;pointer-events:none;white-space:nowrap;">ORDEN VENCIDA</div>`;
      const iconHtml=`<div id="${wrapId}" style="position:relative;width:30px;height:30px;overflow:visible;">${!yaVencio?flechaHtml:''}${overlayHtml}<img src="${imgSrc}" style="width:30px;height:30px;border-radius:50%;"/></div>`;
      marker=L.marker([lat,lng],{icon:L.divIcon({className:'',html:iconHtml,iconSize:[30,30],iconAnchor:[15,15]})}).addTo(map);
      if(showTips)marker.bindTooltip(estado,{permanent:true,direction:'right',className:shouldApplyFormatting(estado)?'estado-label estado-pendiente':'estado-label',offset:[5,0]});
    } else {
      let overlayHtml='';
      if(yaVencio) overlayHtml=`<div class="countdown-overlay" style="display:block;background:rgba(200,0,0,0.90);color:white;font-weight:bold;position:absolute;top:-14px;left:0;width:30px;text-align:center;font-size:10px;padding:1px;z-index:10;pointer-events:none;white-space:nowrap;">ORDEN VENCIDA</div>`;
      let html=`<div style="position:relative;overflow:visible;">${!yaVencio?flechaHtml:''}${overlayHtml}<div class="custom-pin" style="--color:${color}">${estado.charAt(0)}</div></div>`;
      if(showTips)html+=`<div class="${shouldApplyFormatting(estado)?'estado-label estado-pendiente':'estado-label'}">${estado}</div>`;
      marker=L.marker([lat,lng],{icon:L.divIcon({className:'custom-marker-container',html,iconSize:[100,30],iconAnchor:[15,15]})}).addTo(map);
    }
    marker.on('contextmenu',e=>{e.originalEvent.preventDefault();showContextMenu(e.originalEvent.clientX,e.originalEvent.clientY,marker.record);});
    marker.record=record;
    marker.on('click',()=>showRecordDetails(record));
    markers.push(marker);
  });
  const showKml=localStorage.getItem('showKmlPoints')==='true';
  customCoords.forEach(c=>{
    if(c.kml&&!showKml)return;if(c.zone!==selectedZone)return;
    const cz=c.zone||selectedZone;if(!visCat[cz]||!visCat[cz].includes(c.category))return;
    const catColors={'Zona sin Cobertura':'#FF5722','Sin FFTT':'#9C27B0','Zona Peligrosa':'#F44336','Dirección de Técnicos':'#3F51B5'};
    // Usar imagen de categoryImages por categoría-zona (independiente por categoría)
    const imgKey=`${c.category}-${cz}`;
    const imgSrcCoord=categoryImages[imgKey]||c.imgData||null;
    let marker;
    if(imgSrcCoord){
      const wrapId=`cw-${Date.now()}-${Math.random().toString(36).slice(2)}`;
      const iconHtml=`<div id="${wrapId}" style="position:relative;width:30px;height:30px;overflow:visible;"><img src="${imgSrcCoord}" style="width:30px;height:30px;border-radius:50%;"/></div>`;
      marker=L.marker([c.lat,c.lng],{icon:L.divIcon({className:'',html:iconHtml,iconSize:[30,30],iconAnchor:[15,15]})}).addTo(map);
    } else {
      const col=catColors[c.category]||'#607D8B';
      marker=L.marker([c.lat,c.lng],{icon:L.divIcon({className:'custom-pin',html:`<div class="custom-pin" style="--color:${col}">?</div>`,iconSize:[30,30],iconAnchor:[15,15]})}).addTo(map);
    }
    if(c.category==='Dirección de Técnicos'&&c.note)marker.bindTooltip(c.note,{permanent:true,direction:'right',className:'estado-label',offset:[5,0]});
    else marker.bindPopup(`<strong>${c.category}</strong><br>${c.note||''}`);
    marker.on('click',()=>showRecordDetails(c));
    markers.push(marker);
  });
}

function clearMarkers(){markers.forEach(m=>map.removeLayer(m));markers=[];}

// ─── CRUD ─────────────────────────────────────────────────────────────────────
function deleteRecord(recordId){
  showLoading(true);
  setTimeout(async()=>{
    const isManual=customCoords.some(c=>c.id===recordId);
    if(isManual){
      customCoords=customCoords.filter(c=>c.id!==recordId);
      localStorage.setItem(`customCoords_${selectedZone}`,JSON.stringify(customCoords));
      await sbSave('coords',selectedZone,customCoords);renderCustomCoordsList();
    } else {
      allRecords=allRecords.filter(r=>r.id!==recordId);
      localStorage.setItem(`records_${selectedZone}`,JSON.stringify(allRecords));
      await sbSave('records',selectedZone,allRecords);populateFilters();
    }
    document.getElementById('detail-panel').classList.remove('open');
    renderMarkers();updateStatistics();showLoading(false);
    alert('Registro eliminado correctamente');
  },300);
}

// ─── Excel upload ─────────────────────────────────────────────────────────────
function handleExcelUpload(e){
  const file=e.target.files[0];if(!file)return;
  showLoading(true);
  const reader=new FileReader();
  reader.onload=async function(evt){
    const wb=XLSX.read(new Uint8Array(evt.target.result),{type:'array'});
    const json=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''});
    const newRecords=[],coordMap=new Map();
    json.forEach(row=>{
      const lat=parseFloat(row.latitud_Y),lng=parseFloat(row.longitud_X);
      if(isNaN(lat)||isNaN(lng))return;
      const key=`${lat},${lng}`;if(coordMap.has(key))return;coordMap.set(key,true);
      newRecords.push({id:row.id||row.ID||row.Codigo||Date.now()+Math.random(),Codigo:row.Codigo,Cliente:row.Cliente,Direccion:row.Direccion,longitud_X:lng,latitud_Y:lat,Ubicacion:row.Ubicacion,Location:row.Location||row.location||row.LOCATION||'',Distrito:row.Distrito,Tecnico:row.Tecnico,Estado:row.Estado,Observaciones:row.Observaciones,Estado2:row.Estado2,Tramo:row.Tramo,Negocio:row.Negocio});
    });
    allRecords=newRecords;
    window._userHasZoomed = false; // reset para que fitBounds aplique al cargar nuevo archivo
    localStorage.setItem(`records_${selectedZone}`,JSON.stringify(allRecords));
    await sbSave('records',selectedZone,allRecords);
    flashRealtimeIndicator(`${newRecords.length} registros publicados en tiempo real`);
    populateFilters();renderMarkers();updateStatistics();showLoading(false);e.target.value='';
  };
  reader.readAsArrayBuffer(file);
}

// ─── KML upload ───────────────────────────────────────────────────────────────
function handleKmlUpload(e){
  const file=e.target.files[0];if(!file)return;
  const msgEl=document.getElementById('kml-upload-msg');
  msgEl.textContent='Procesando KML...';msgEl.className='small mt-1 text-info';
  const html=`<div class="modal fade" id="kmlCatModal" tabindex="-1"><div class="modal-dialog"><div class="modal-content"><div class="modal-header"><h5 class="modal-title">Seleccionar Categoría</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body"><select id="kml-category-select" class="form-select"><option value="Zona sin Cobertura">Zona sin Cobertura</option><option value="Sin FFTT">Sin FFTT</option><option value="Zona Peligrosa">Zona Peligrosa</option><option value="Dirección de Técnicos">Dirección de Técnicos</option></select></div><div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button><button type="button" class="btn btn-primary" id="kml-confirm-btn">Confirmar</button></div></div></div></div>`;
  const mc=document.createElement('div');mc.innerHTML=html;document.body.appendChild(mc);
  const modalEl=document.getElementById('kmlCatModal'),modal=new bootstrap.Modal(modalEl);modal.show();
  document.getElementById('kml-confirm-btn').addEventListener('click',function(){
    const cat=document.getElementById('kml-category-select').value;
    modal.hide();showLoading(true);
    const reader=new FileReader();
    reader.onload=async function(evt){
      try{
        const doc=new DOMParser().parseFromString(evt.target.result,'text/xml');
        const pms=doc.getElementsByTagName('Placemark');
        const newCoords=[];
        for(let i=0;i<pms.length;i++){
          const pm=pms[i];
          const name=pm.querySelector('name')?.textContent||'';
          const coords=pm.getElementsByTagName('coordinates')[0]?.textContent.trim();
          if(!coords)continue;const parts=coords.split(',');if(parts.length<2)continue;
          const lng=parseFloat(parts[0]),lat=parseFloat(parts[1]);
          if(isNaN(lat)||isNaN(lng))continue;
          newCoords.push({id:Date.now()+i,lat,lng,category:cat,note:name,imgData:null,zone:selectedZone,kml:true});
        }
        // ── Acumular por categoría: elimina solo los KML de ESTA categoría y zona,
        //    conserva las demás categorías intactas ──
        const sinEstaCategoria=customCoords.filter(c=>!(c.kml&&c.zone===selectedZone&&c.category===cat));
        customCoords=[...sinEstaCategoria,...newCoords];
        localStorage.setItem(`customCoords_${selectedZone}`,JSON.stringify(customCoords));
        await sbSave('coords',selectedZone,customCoords);
        flashRealtimeIndicator(`${newCoords.length} puntos KML publicados en tiempo real`);
        renderCustomCoordsList();updateCategoryCheckboxes();renderMarkers();
        msgEl.textContent=`${newCoords.length} coordenadas procesadas.`;msgEl.className='small mt-1 text-success';
        showLoading(false);
      }catch(err){msgEl.textContent='Error KML: '+err.message;msgEl.className='small mt-1 text-danger';showLoading(false);}
    };
    reader.readAsText(file);
  });
  modalEl.addEventListener('hidden.bs.modal',()=>{if(mc.parentNode===document.body)document.body.removeChild(mc);});
}

// ─── Coord form ───────────────────────────────────────────────────────────────
function setupCoordForm(){
  document.getElementById('save-coord').addEventListener('click',()=>{
    const loc=document.getElementById('coord-input').value.trim();
    const cat=document.getElementById('coord-category').value;
    if(!loc||!cat){alert('Debe ingresar ubicación y categoría.');return;}
    const parts=loc.split(',').map(s=>parseFloat(s.trim()));
    if(parts.length!==2||parts.some(isNaN)){alert('Formato inválido. Use "lat, lng"');return;}
    const note=document.getElementById('coord-note').value.trim();
    const file=document.getElementById('coord-image').files[0];
    const entry={id:Date.now(),lat:parts[0],lng:parts[1],category:cat,note,imgData:null,zone:selectedZone};
    if(file){const r=new FileReader();r.onload=e=>{entry.imgData=e.target.result;saveAndRenderCoord(entry);};r.readAsDataURL(file);}
    else saveAndRenderCoord(entry);
  });
  document.getElementById('coord-input').addEventListener('input',function(){
    const parts=this.value.trim().split(',').map(s=>parseFloat(s.trim()));
    if(parts.length===2&&!parts.some(isNaN)){
      if(window.tempPreviewMarker)map.removeLayer(window.tempPreviewMarker);
      window.tempPreviewMarker=L.marker([parts[0],parts[1]],{icon:L.divIcon({className:'custom-pin',html:`<div class="custom-pin" style="--color:#4285F4;opacity:.6">📍</div>`,iconSize:[30,30],iconAnchor:[15,15]})}).addTo(map);
      map.setView([parts[0],parts[1]],15);
    }
  });
  updateCategoryCheckboxes();
}

async function saveAndRenderCoord(entry){

function updateCategoryCheckboxes(){
  const container=document.getElementById('category-checkboxes');if(!container)return;
  container.innerHTML='';
  const counts={};
  customCoords.forEach(c=>{const z=c.zone||selectedZone;const k=`${c.category}-${z}`;counts[k]=(counts[k]||0)+1;});
  const uniq=[...new Set(customCoords.map(c=>c.category))];

  // Etiquetas cortas por categoría
  const shortName={'Zona sin Cobertura':'S/Cob','Sin FFTT':'S/FFTT','Zona Peligrosa':'Peligrosa','Dirección de Técnicos':'Técnicos'};

  uniq.forEach(category=>{
    ['LIMA','PROVINCIA'].forEach(zone=>{
      const k=`${category}-${zone}`;if(!counts[k])return;
      const catId=`category-${category.replace(/\s+/g,'-').toLowerCase()}-${zone}`;
      const imgKey=`${category}-${zone}`;
      const hasImg=!!categoryImages[imgKey];

      // Fila única compacta
      const div=document.createElement('div');
      div.dataset.zone=zone;
      div.style.cssText=`display:${zone===selectedZone?'flex':'none'};align-items:center;gap:4px;padding:3px 4px;margin-bottom:3px;background:#f8f9fa;border-radius:5px;border:1px solid #dee2e6;`;

      // Checkbox
      const cb=document.createElement('input');cb.type='checkbox';cb.id=catId;cb.dataset.category=category;cb.dataset.zone=zone;cb.checked=localStorage.getItem(catId)!=='false';cb.style.flexShrink='0';

      // Label corto
      const lbl=document.createElement('label');lbl.htmlFor=catId;
      lbl.style.cssText='font-size:11px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;';
      lbl.title=`${category} - ${zone}`;
      lbl.textContent=`${shortName[category]||category} (${counts[k]})`;

      // Botón imagen
      const fileInp=document.createElement('input');fileInp.type='file';fileInp.accept='.jpg,.jpeg,.png';fileInp.className='visually-hidden';
      const imgBtn=document.createElement('button');
      imgBtn.style.cssText=`padding:1px 5px;font-size:10px;border-radius:3px;border:1px solid ${hasImg?'#28a745':'#6c757d'};background:${hasImg?'#28a745':'transparent'};color:${hasImg?'white':'#6c757d'};cursor:pointer;flex-shrink:0;`;
      imgBtn.innerHTML=hasImg?'✓🖼':'🖼';
      imgBtn.title=hasImg?`Cambiar imagen de "${category}"`:` Asignar imagen a "${category}"`;
      imgBtn.addEventListener('click',()=>fileInp.click());
      fileInp.addEventListener('change',async function(ev){
        const f=ev.target.files[0];if(!f)return;
        const rdr=new FileReader();
        rdr.onload=async function(e2){
          categoryImages[imgKey]=e2.target.result;
          localStorage.setItem('categoryImages',JSON.stringify(categoryImages));
          await sbSaveGlobal('category_images',categoryImages);
          updateCategoryCheckboxes();renderMarkers();fileInp.value='';
        };rdr.readAsDataURL(f);
      });

      // Botón quitar imagen (solo si tiene)
      if(hasImg){
        const delImgBtn=document.createElement('button');
        delImgBtn.style.cssText='padding:1px 5px;font-size:10px;border-radius:3px;border:1px solid #dc3545;background:transparent;color:#dc3545;cursor:pointer;flex-shrink:0;';
        delImgBtn.innerHTML='✕';delImgBtn.title=`Quitar imagen de "${category}"`;
        delImgBtn.addEventListener('click',async()=>{
          delete categoryImages[imgKey];
          localStorage.setItem('categoryImages',JSON.stringify(categoryImages));
          await sbSaveGlobal('category_images',categoryImages);
          updateCategoryCheckboxes();renderMarkers();
        });
        div.appendChild(delImgBtn);
      }

      // Botón limpiar
      const clearBtn=document.createElement('button');
      clearBtn.style.cssText='padding:1px 5px;font-size:10px;border-radius:3px;border:1px solid #dc3545;background:transparent;color:#dc3545;cursor:pointer;flex-shrink:0;';
      clearBtn.innerHTML='🗑';clearBtn.title=`Eliminar todos los puntos de "${category}" - ${zone}`;
      clearBtn.addEventListener('click',async()=>{
        if(!confirm(`¿Eliminar todos los puntos de "${category}" - ${zone}?`))return;
        customCoords=customCoords.filter(c=>!(c.category===category&&(c.zone||selectedZone)===zone));
        localStorage.setItem(`customCoords_${selectedZone}`,JSON.stringify(customCoords));
        await sbSave('coords',selectedZone,customCoords);
        renderCustomCoordsList();updateCategoryCheckboxes();renderMarkers();
        flashRealtimeIndicator(`"${category}" limpiado`);
      });

      div.appendChild(cb);div.appendChild(lbl);div.appendChild(imgBtn);div.appendChild(clearBtn);div.appendChild(fileInp);
      container.appendChild(div);
      cb.addEventListener('change',function(){localStorage.setItem(this.id,this.checked);renderMarkers();});
    });
  });
}

function searchByCodigo(){
  const raw=document.getElementById('codigo-search').value.trim();

  if(!record){msgEl.textContent=`Código "${raw}" no encontrado.`;return;}
  map.setView([record.latitud_Y,record.longitud_X],16);

  L.popup({offset:[0,-15]}).setLatLng([record.latitud_Y,record.longitud_X]).setContent(popupHTML).openOn(map);

function getTechnicianSuggestions(record){
  if(record.Tecnico)return[];
  const wl={},byD={};
  allRecords.forEach(r=>{if(!r.Tecnico)return;wl[r.Tecnico]=(wl[r.Tecnico]||0)+1;if(r.Distrito){if(!byD[r.Distrito])byD[r.Distrito]=new Set();byD[r.Distrito].add(r.Tecnico);}});
  const inD=record.Distrito&&byD[record.Distrito]?Array.from(byD[record.Distrito]):[];
  return Object.keys(wl).map(t=>({t,score:(inD.includes(t)?100:0)-(wl[t]*5)})).sort((a,b)=>b.score-a.score).slice(0,5).map(x=>x.t);
}

function startCountdownTimer(){if(countdownInterval)clearInterval(countdownInterval);countdownInterval=setInterval(updateCountdowns,1000);}
function updateCountdowns(){
  const now=new Date();
  const hour=now.getHours(),min=now.getMinutes(),sec=now.getSeconds();
  const nowSegs=hour*3600+min*60+sec;
  let soon=0;

  markers.forEach(marker=>{
    if(!marker.record||!marker.record.Estado) return;
    const estado=marker.record.Estado;
    const match=estado.match(/(8\/12|12\/16|16\/20)/);
    if(!match||!/(pendiente|coord)/i.test(estado)) return;
    const iv=getIntervalFromRange(match[1]);
    if(!iv) return;

    const venceSegs  = iv.end*3600;
    const alertaSegs = venceSegs-3600;
    const restaSegs  = venceSegs-nowSegs;

    let el=null;
    try{el=marker.getElement();}catch(e){}
    if(!el) return;

    // Buscar o crear overlay dentro del elemento del marker
    let ov=el.querySelector('.countdown-overlay');

    if(nowSegs>=venceSegs){
      if(!ov){ov=document.createElement('div');ov.className='countdown-overlay';el.insertBefore(ov,el.firstChild);}
      ov.style.cssText='display:block!important;background:rgba(200,0,0,0.92)!important;color:white!important;font-weight:bold!important;position:absolute!important;top:-18px!important;left:0!important;min-width:55px!important;white-space:nowrap!important;font-size:10px!important;padding:2px 5px!important;border-radius:3px!important;z-index:9999!important;pointer-events:none!important;overflow:visible!important;';
      ov.textContent='VENCIDO';
      return;
    }

    if(nowSegs>=alertaSegs&&nowSegs<venceSegs){
      const mm=Math.floor(restaSegs/60);
      const ss=Math.floor(restaSegs%60);
      if(!ov){ov=document.createElement('div');ov.className='countdown-overlay';el.insertBefore(ov,el.firstChild);}
      ov.style.cssText='display:block!important;background:rgba(200,0,0,0.85)!important;color:white!important;font-weight:bold!important;position:absolute!important;top:-18px!important;left:0!important;min-width:45px!important;white-space:nowrap!important;font-size:10px!important;padding:2px 5px!important;border-radius:3px!important;z-index:9999!important;pointer-events:none!important;overflow:visible!important;';
      ov.textContent=`⚠ ${String(mm).padStart(2,'0')}:${String(ss).padStart(2,'00')}`;
      soon++;
    } else {
      if(ov) ov.style.display='none';
    }
  });

  const go=document.getElementById('global-timer-overlay');
  if(go){
    go.style.display=soon>0?'block':'none';
    if(soon>0) go.textContent=`⚠ ${soon} pendiente${soon!==1?'s':''} por vencer`;
  }
}
function getIntervalFromRange(tr){
  if(!tr) return null;
  const clean=tr.trim();
  return [{name:'8/12',start:8,end:12},{name:'12/16',start:12,end:16},{name:'16/20',start:16,end:20}].find(i=>i.name===clean)||null;
}
function onCountdownEnd(record,marker){
  const el=marker.getElement();if(!el)return;
  el.classList.add('countdown-expired');
  // Sin popup que interrumpa — solo overlay rojo fijo
  let ov=el.querySelector('.countdown-overlay');
  if(!ov){ov=document.createElement('div');ov.className='countdown-overlay';el.appendChild(ov);}
  ov.style.display='block';
  ov.style.background='rgba(200,0,0,0.90)';
  ov.style.color='white';
  ov.style.fontWeight='bold';
  ov.textContent='ORDEN VENCIDA';
}
function shouldApplyFormatting(estado){
  if(!estado) return false;
  if(/8\/12/.test(estado)&&/(pendiente|coord)/i.test(estado))  return localStorage.getItem('format-8-12')==='true';
  if(/12\/16/.test(estado)&&/(pendiente|coord)/i.test(estado)) return localStorage.getItem('format-12-16')==='true';
  if(/16\/20/.test(estado)&&/(pendiente|coord)/i.test(estado)) return localStorage.getItem('format-16-20')==='true';
  return false;
}

function setupStyleLegend(){
  const menu=document.querySelector('#style-legend .dropdown-menu');if(!menu)return;menu.innerHTML='';
  MAP_STYLES.forEach(s=>{
    const li=document.createElement('li');li.innerHTML=`<a class="dropdown-item" href="#">${s.name}</a>`;
    li.querySelector('a').addEventListener('click',e=>{e.preventDefault();applyMapStyle(s.name);});
    menu.appendChild(li);
  });
  buildSidebarStyleLegend();
}
function buildSidebarStyleLegend(){
  const ul=document.getElementById('sidebar-style-legend');if(!ul)return;ul.innerHTML='';
  MAP_STYLES.forEach(s=>{
    const li=document.createElement('li');li.textContent=s.name;li.dataset.style=s.name;
    li.addEventListener('click',()=>{applyMapStyle(s.name);highlightSidebarStyle(s.name);});
    ul.appendChild(li);
  });
  highlightSidebarStyle(localStorage.getItem('selectedStyle')||MAP_STYLES[0].name);
}
function highlightSidebarStyle(name){document.querySelectorAll('#sidebar-style-legend li').forEach(li=>li.classList.toggle('active',li.dataset.style===name));}

// ─── Context menu ─────────────────────────────────────────────────────────────
function showContextMenu(x,y,record){
  const cm=document.getElementById('context-menu');if(!cm)return;
  cm.style.left=`${x}px`;cm.style.top=`${y}px`;
  // technicianList ya viene fresco de Supabase (nunca de localStorage)
  technicianList.sort((a,b)=>a.localeCompare(b));
  let html=`<div class="context-menu-header">Asignar Técnico</div>
    <div class="context-menu-item" data-tech="">Sin técnico</div>
    <div class="context-menu-separator"></div>`;
  technicianList.forEach(t=>{
    html+=`<div class="context-menu-item${t===record.Tecnico?' bg-light fw-bold':''}" data-tech="${t}">${t}</div>`;
  });
  html+=`<div class="context-menu-separator"></div>
    <div class="context-menu-item text-danger" data-action="delete-tech">Eliminar Técnico de la lista</div>
    <div class="context-menu-separator"></div>
    <input type="text" class="form-control form-control-sm context-menu-input" id="new-tech-input" placeholder="Nuevo técnico...">
    <button class="btn btn-sm btn-primary context-menu-add-btn" id="add-tech-btn">Agregar Técnico</button>`;
  cm.innerHTML=html;cm.style.display='block';

  cm.querySelectorAll('.context-menu-item').forEach(item=>{
    item.addEventListener('click',async function(){
      if(this.getAttribute('data-action')==='delete-tech'){
        const cur=record.Tecnico;
        if(!cur||!confirm(`¿Eliminar al técnico "${cur}" de la lista?`)){cm.style.display='none';return;}
        technicianList=technicianList.filter(t=>t!==cur);
        await sbSaveGlobal('technician_list',technicianList);
        // localStorage se actualiza solo via listener realtime
        await updateRecordTechnician(record.id,'');
        showContextMenu(x,y,{...record,Tecnico:''});
        return;
      }
      await updateRecordTechnician(record.id,this.getAttribute('data-tech'));
      showRecordDetails(record);cm.style.display='none';
    });
  });

  async function addNewTech(){
    const inp=document.getElementById('new-tech-input');if(!inp||!inp.value.trim())return;
    const nt=inp.value.trim();
    if(!technicianList.includes(nt)){
      technicianList.push(nt);
      technicianList.sort((a,b)=>a.localeCompare(b));
      await sbSaveGlobal('technician_list',technicianList);
      // localStorage se actualiza solo via listener realtime
    }
    await updateRecordTechnician(record.id,nt);
    showRecordDetails(record);cm.style.display='none';
  }
  document.getElementById('add-tech-btn')?.addEventListener('click',addNewTech);
  document.getElementById('new-tech-input')?.addEventListener('keypress',e=>{if(e.key==='Enter')addNewTech();});
}

if(localStorage.getItem('showTooltips')===null)localStorage.setItem('showTooltips','true');
</script>
