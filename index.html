<!-- Firebase SDK (Realtime Database) -->
<script type="module">
  // Import Firebase functions
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getDatabase, ref, set, get, onValue, push, update, remove, off } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

  // Firebase Realtime Database configuration
  const firebaseConfig = {
    apiKey: "AIzaSyAGvkerJ71aH4tisdecNpLwiW_YntFwz_g",
    authDomain: "mapa-tec-f0b8b.firebaseapp.com",
    databaseURL: "https://mapa-tec-f0b8b-default-rtdb.firebaseio.com",
    projectId: "mapa-tec-f0b8b",
    storageBucket: "mapa-tec-f0b8b.firebasestorage.app",
    messagingSenderId: "417979815624",
    appId: "1:417979815624:web:a382206af7a171c3a977fd",
    measurementId: "G-3JLV6RDFJD"
  };

  // Initialize Firebase
  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  
  // Auth state
  let isAuthenticated = true;
    
  // Export to window for global access
  window.firebaseApp = app;
  window.firebaseDB = db;
  window.firebaseAuth = { isAuthenticated: () => isAuthenticated };
  
  // ========== Firebase Realtime Database Functions ==========
  
  // Save data to Firebase
  async function saveToFirebase(path, data) {
try {
      const dbRef = ref(db, path);
      await set(dbRef, data);
      console.log(`Guardado en Firebase: ${path}`);
      return true;
    } catch (error) {
      console.error(`Error guardando en Firebase (${path}):`, error);
      return false;
    }
  }
  
  // Load data from Firebase with optional callback
  async function loadFromFirebase(path, callback = null) {
    try {
      const dbRef = ref(db, path);
      const snapshot = await get(dbRef);
      if (snapshot.exists()) {
        const data = snapshot.val();
        if (callback) callback(data);
        return data;
      }
      return null;
    } catch (error) {
      console.error(`Error cargando de Firebase (${path}):`, error);
      return null;
    }
  }
  
  // Listen for real-time updates from Firebase
  function listenToFirebase(path, callback) {
    const dbRef = ref(db, path);
    return onValue(dbRef, (snapshot) => {
      if (snapshot.exists()) {
        callback(snapshot.val());
      }
    });
  }
  
  // Remove listener
  function stopListening(path) {
    const dbRef = ref(db, path);
    off(dbRef);
  }
  
      // Login (compatibilidad): siempre habilitado para edici�n compartida en Firebase
  async function login(password) {
    isAuthenticated = true;
    updateAuthUI(true);
    return true;
  }
  
  // Logout deshabilitado: se mantiene sesi�n de edici�n compartida
  function logout() {
    isAuthenticated = true;
    updateAuthUI(true);
  }

  // Update auth UI
  function updateAuthUI(authenticated) {
    const loginSection = document.getElementById('login-section');
    const authStatus = document.getElementById('auth-status');
    const logoutBtn = document.getElementById('logout-btn');
    const syncSection = document.getElementById('sync-section');

    if (loginSection) loginSection.style.display = 'none';
    if (logoutBtn) logoutBtn.style.display = 'none';
    if (syncSection) syncSection.style.display = 'none';
    if (authStatus) {
      authStatus.innerHTML = '<span class="badge bg-success"><i class="fas fa-cloud"></i> Firebase compartido</span>';
    }

    window.dispatchEvent(new CustomEvent('authStateChanged', { detail: { authenticated: true } }));
  }

  // Sync local data to Firebase
  async function syncLocalToFirebase() {

    
    try {
      // Sync records for both zones
      const zones = ['LIMA', 'PROVINCIA'];
      zones.forEach(zone => {
        const records = localStorage.getItem(`records_${zone}`);
        if (records) {
          saveToFirebase(`records/${zone}`, JSON.parse(records));
        }
        const coords = localStorage.getItem(`customCoords_${zone}`);
        if (coords) {
          saveToFirebase(`coords/${zone}`, JSON.parse(coords));
        }
      });
      
      // Sync techImages
      const techImages = localStorage.getItem('techImages');
      if (techImages) {
        saveToFirebase('techImages', JSON.parse(techImages));
      }
      
      // Sync technicianList
      const techList = localStorage.getItem('technicianList');
      if (techList) {
        saveToFirebase('technicianList', JSON.parse(techList));
      }
      
      // Sync deletedRecords
      const deletedRecords = localStorage.getItem('deletedRecordsByCategory');
      if (deletedRecords) {
        saveToFirebase('deletedRecords', JSON.parse(deletedRecords));
      }
      
      console.log('Sincronización local → Firebase completada');
    } catch (error) {
      console.error('Error en sincronización local → Firebase:', error);
    }
  }
  
  // Sync Firebase data to local
  async function syncFirebaseToLocal() {
    try {
      // Load and sync each path
      const recordsLima = await loadFromFirebase('records/LIMA');
      if (recordsLima) {
        localStorage.setItem('records_LIMA', JSON.stringify(recordsLima));
      }
      
      const recordsProvincia = await loadFromFirebase('records/PROVINCIA');
      if (recordsProvincia) {
        localStorage.setItem('records_PROVINCIA', JSON.stringify(recordsProvincia));
      }
      
      const coordsLima = await loadFromFirebase('coords/LIMA');
      if (coordsLima) {
        localStorage.setItem('customCoords_LIMA', JSON.stringify(coordsLima));
      }
      
      const coordsProvincia = await loadFromFirebase('coords/PROVINCIA');
      if (coordsProvincia) {
        localStorage.setItem('customCoords_PROVINCIA', JSON.stringify(coordsProvincia));
      }
      
      const techImages = await loadFromFirebase('techImages');
      if (techImages) {
        localStorage.setItem('techImages', JSON.stringify(techImages));
      }
      
      const techList = await loadFromFirebase('technicianList');
      if (techList) {
        localStorage.setItem('technicianList', JSON.stringify(techList));
      }
      
      const deletedRecords = await loadFromFirebase('deletedRecords');
      if (deletedRecords) {
        localStorage.setItem('deletedRecordsByCategory', JSON.stringify(deletedRecords));
      }
      
      console.log('Sincronización Firebase → local completada');
    } catch (error) {
      console.error('Error en sincronización Firebase → local:', error);
    }
  }
  
    // Initialize Firebase shared mode
  function initAuth() {
    isAuthenticated = true;
    updateAuthUI(true);
  }
  
  // Export functions globally
  window.firebaseSave = saveToFirebase;
  window.firebaseLoad = loadFromFirebase;
  window.firebaseListen = listenToFirebase;
  window.firebaseStopListening = stopListening;
  window.firebaseLogin = login;
  window.firebaseLogout = logout;
  window.firebaseSyncTo = syncLocalToFirebase;
  window.firebaseSyncFrom = syncFirebaseToLocal;
  window.firebaseInitAuth = initAuth;
  
  console.log("Firebase Realtime Database inicializado correctamente");
</script>

    function shouldApplyFormatting(estado) {
      if (!estado) return false;
      const now = new Date();
      const hour = now.getHours();
      if (/Pendiente\s*-\s*8\/12/.test(estado)) {
        return localStorage.getItem('format-8-12') === 'true' && hour >= 8 && hour < 12;
      }
      if (/Pendiente\s*-\s*12\/16/.test(estado)) {
        return localStorage.getItem('format-12-16') === 'true' && hour >= 12 && hour < 16;
      }
      if (/Pendiente\s*-\s*16\/20/.test(estado)) {
        return localStorage.getItem('format-16-20') === 'true' && hour >= 16 && hour < 20;
      }
      return false;

        async function loadZoneData(zone) {

      try {
        const recordsKey = `records/${zone}`;

        const recordsData = (typeof window.firebaseLoad === 'function') ? await window.firebaseLoad(recordsKey) : null;
        const coordsData = (typeof window.firebaseLoad === 'function') ? await window.firebaseLoad(coordsKey) : null;

        const firebaseDeleted = (typeof window.firebaseLoad === 'function') ? await window.firebaseLoad('deletedRecords') : null;

        allRecords = Array.isArray(recordsData) ? recordsData : [];
        customCoords = Array.isArray(coordsData) ? coordsData : [];

        localStorage.setItem(`records_${zone}`, JSON.stringify(allRecords));
        localStorage.setItem(`customCoords_${zone}`, JSON.stringify(customCoords));

        if (firebaseTechImages && typeof firebaseTechImages === 'object') {
          techImages = firebaseTechImages;

        showLoading(false);

    function searchByCodigo() {
      const rawInput = document.getElementById('codigo-search').value.trim();
      const msgEl = document.getElementById('codigo-search-msg');
      msgEl.textContent = '';
      if (!rawInput) { msgEl.textContent='Por favor ingrese un Código.'; return; }
      const inputNum = Number(rawInput);
      const record = allRecords.find(r => {
        const code = r.Codigo, codeNum = Number(code);
        if (!isNaN(inputNum)&&!isNaN(codeNum)) return codeNum===inputNum;
        return String(code)===rawInput;
      });
      if (!record) { msgEl.textContent=`Código "${rawInput}" no encontrado.`; return; }
      map.setView([record.latitud_Y, record.longitud_X], 16);
      const popupHTML = `<div><strong>Código:</strong> ${record.Codigo}<br><strong>Cliente:</strong> ${record.Cliente}<br><strong>Dirección:</strong> ${record.Direccion}</div>`;
      L.popup({ offset:[0,-15] }).setLatLng([record.latitud_Y,record.longitud_X]).setContent(popupHTML).openOn(map);
      document.getElementById('search-position').textContent = `Ubicación: ${record.latitud_Y.toFixed(6)}, ${record.longitud_X.toFixed(6)}`;
      showRecordDetails(record);
      const match = markers.find(m => {
        const ll = m.getLatLng();
        return ll.lat === record.latitud_Y && ll.lng === record.longitud_X;
      });
      if (match && match.getElement) {
        const el = match.getElement();
        el.classList.add('glow');
        setTimeout(() => el.classList.remove('glow'), 3000);

    function deleteRecord(recordId) {
      showLoading(true);
      setTimeout(() => {
        const isManualCoord = customCoords.some(c => c.id === recordId);
        if (isManualCoord) {
          customCoords = customCoords.filter(c => c.id !== recordId);
          localStorage.setItem(`customCoords_${selectedZone}`, JSON.stringify(customCoords));
          
          // Sync to Firebase
          if (typeof window.firebaseSave === 'function') {
            window.firebaseSave(`coords/${selectedZone}`, customCoords);
          }
          
          renderCustomCoordsList();
        } else {
          allRecords = allRecords.filter(r => r.id !== recordId);
          localStorage.setItem(`records_${selectedZone}`, JSON.stringify(allRecords));
          
          // Sync to Firebase
          if (typeof window.firebaseSave === 'function') {

          }

        }

    function applyFilters() {
      const t = document.getElementById('tramo-filter').value;
      const e = document.getElementById('estado-filter').value;
      const tech = document.getElementById('tecnico-filter').value;
      const neg = document.getElementById('negocio-filter').value;
      const dist = document.getElementById('distrito-filter').value;
      clearMarkers();
      let filtered = allRecords;
      if (t) filtered = filtered.filter(r => r.Tramo === t);
      if (e) {
        if (e === "pendiente_combinado") {
          filtered = filtered.filter(r =>
            r.Estado2 === "PROGRAMADO" || 
            r.Estado2 === "EN CAMINO" || 
            r.Estado2 === "COORDINADO"
          );
        } else {
          filtered = filtered.filter(r => r.Estado2 === e);
        }
      }
      if (tech) filtered = filtered.filter(r => tech === 'sin_tecnico' ? !r.Tecnico : r.Tecnico === tech);
      if (neg) filtered = filtered.filter(r => r.Negocio === neg);
      if (dist) {
        const normalizedDist = normalizeString(dist);
        filtered = filtered.filter(r => normalizeString(r.Distrito) === normalizedDist);
      }
      renderMarkersFromRecords(filtered);
      if (markers.length > 0) {
        const g = new L.featureGroup(markers);
        map.fitBounds(g.getBounds(), { padding: [50, 50] });
      }
    }

    function renderMarkers() {
      clearMarkers();
      renderMarkersFromRecords(allRecords);
      if (markers.length > 0) {
        const g = new L.featureGroup(markers);
        map.fitBounds(g.getBounds(), { padding: [50, 50] });
      }
    }

    // --- renderMarkersFromRecords modifications ---
    function renderMarkersFromRecords(records) {
      clearMarkers();
      const tecnicos = [...new Set(records.map(r => r.Tecnico).filter(Boolean))];
      const colors = ['#4285F4','#EA4335','#FBBC05','#34A853','#8E24AA'];
      tecnicos.forEach((tec, i) => {
        if (!techColors[tec]) techColors[tec] = colors[i % colors.length];
      });
      techColors['sin_tecnico'] = '#9E9E9E';
      const showTooltips = localStorage.getItem('showTooltips') !== 'false';
      const showTooltipsEl = document.getElementById('show-tooltips');
      if (showTooltipsEl) {
        showTooltipsEl.checked = showTooltips;
      }
      const categoryCheckboxes = document.querySelectorAll('#category-checkboxes input[type="checkbox"]');
      const visibleCategories = {};
      Array.from(categoryCheckboxes)
        .filter(cb => cb.checked)
        .forEach(cb => {
          const category = cb.dataset.category;
          const zone = cb.dataset.zone;
          if (!visibleCategories[zone]) visibleCategories[zone] = [];
          visibleCategories[zone].push(category);
        });
      records.forEach(record => {
        const lat = record.latitud_Y, lng = record.longitud_X;
        if (!lat || !lng) return;
        const estado = record.Estado || 'N/A';
        const color = record.Tecnico && techColors[record.Tecnico] ? techColors[record.Tecnico] : techColors['sin_tecnico'];
        let marker;
        if (record.Tecnico && techImages[record.Tecnico]) {
          const imgIcon = L.icon({ iconUrl: techImages[record.Tecnico], iconSize: [30, 30], iconAnchor: [15, 15] });
          marker = L.marker([lat, lng], { icon: imgIcon }).addTo(map);
          if (showTooltips) {
            const isFormatEnabled = shouldApplyFormatting(estado);
            marker.bindTooltip(estado, {
              permanent: true,
              direction: 'right',
              className: isFormatEnabled ? 'estado-label estado-pendiente' : 'estado-label',
              offset: [5, 0]
            });
          }
        } else if (!record.Tecnico && techImages['sin_tecnico']) {
          const imgIcon = L.icon({ iconUrl: techImages['sin_tecnico'], iconSize: [30, 30], iconAnchor: [15, 15] });
          marker = L.marker([lat, lng], { icon: imgIcon }).addTo(map);
          if (showTooltips) {
            const isFormatEnabled = shouldApplyFormatting(estado);
            marker.bindTooltip(estado, {
              permanent: true,
              direction: 'right',
              className: isFormatEnabled ? 'estado-label estado-pendiente' : 'estado-label',
              offset: [5, 0]
            });
          }
        } else {
          let html = `<div class="custom-pin" style="--color:${color}">${estado.charAt(0)}</div>`;
          if (showTooltips) {
            html += `<div class="${shouldApplyFormatting(estado) ? 'estado-label estado-pendiente' : 'estado-label'}">${estado}</div>`;
          }
          marker = L.marker([lat, lng], {
            icon: L.divIcon({
              className: 'custom-marker-container',
              html: html,
              iconSize: [100, 30],
              iconAnchor: [15, 15]
            })
          }).addTo(map);
        }
        // Add the contextmenu event to the marker
        marker.on('contextmenu', function(e) {
          e.originalEvent.preventDefault();
          showContextMenu(e.originalEvent.clientX, e.originalEvent.clientY, this.record);
        });
        marker.record = record;
        marker.on('click', () => showRecordDetails(record));
        markers.push(marker);
      });
      // Render custom coords (including KML points)
      const showKml = localStorage.getItem('showKmlPoints') === 'true';
      customCoords.forEach(c => {
        if (c.kml && !showKml) return;
        if (c.zone !== selectedZone) return;
        const coordZone = c.zone || selectedZone;
        if (!visibleCategories[coordZone] || !visibleCategories[coordZone].includes(c.category)) return;
        let marker;
        if (c.imgData) {
          marker = L.marker([c.lat, c.lng], { icon: L.icon({ iconUrl: c.imgData, iconSize: [30, 30], iconAnchor: [15, 15] }) }).addTo(map);
        } else {
          const catColors = {'Zona sin Cobertura': '#FF5722', 'Sin FFTT': '#9C27B0', 'Zona Peligrosa': '#F44336', 'Dirección de Técnicos': '#3F51B5'};
          const col = catColors[c.category] || '#607D8B';
          const html = `<div class="custom-pin" style="--color:${col}">?</div>`;
          marker = L.marker([c.lat, c.lng], { icon: L.divIcon({ className: 'custom-pin', html, iconSize: [30, 30], iconAnchor: [15, 15] }) }).addTo(map);
        }
        if (c.category === 'Dirección de Técnicos' && c.note) {
          marker.bindTooltip(c.note, {
            permanent: true,
            direction: 'right',
            className: 'estado-label',
            offset: [5, 0]
          });
        } else {
          marker.bindPopup(`<strong>${c.category}</strong><br>${c.note || ''}`);
        }
        marker.on('click', () => showRecordDetails(c));
        markers.push(marker);
      });
    }

    function clearMarkers() {
      markers.forEach(m => map.removeLayer(m));
      markers = [];

    function getTechnicianSuggestions(record) {
      if (record.Tecnico) return [];
      const recordDistrict = record.Distrito;
      const recordLat = record.latitud_Y;
      const recordLng = record.longitud_X;
      let recordInterval = null;
      if (record.Estado && /^Pendiente\s*-\s*(8\/12|12\/16|16\/20)$/.test(record.Estado)) {
        const timeRange = record.Estado.split('-')[1].trim();
        recordInterval = getIntervalFromRange(timeRange);
      }
      const technicianWorkload = {};
      const techniciansByDistrict = {};
      const technicianLocations = {};
      allRecords.forEach(r => {
        if (!r.Tecnico) return;
        technicianWorkload[r.Tecnico] = (technicianWorkload[r.Tecnico] || 0) + 1;
        if (r.Distrito) {
          if (!techniciansByDistrict[r.Distrito]) techniciansByDistrict[r.Distrito] = new Set();
          techniciansByDistrict[r.Distrito].add(r.Tecnico);
        }
        if (r.latitud_Y && r.longitud_X) {
          if (!technicianLocations[r.Tecnico]) {
            technicianLocations[r.Tecnico] = { lat: r.latitud_Y, lng: r.longitud_X };
          }
        }
        if (recordInterval && r.Estado && /^Pendiente\s*-\s*(8\/12|12\/16|16\/20)$/.test(r.Estado)) {
          const rTimeRange = r.Estado.split('-')[1].trim();
          const rInterval = getIntervalFromRange(rTimeRange);
          if (rInterval && rInterval.name === recordInterval.name) {
            if (!technicianWorkload[`${r.Tecnico}_busy_${rInterval.name}`]) {
              technicianWorkload[`${r.Tecnico}_busy_${rInterval.name}`] = 1;
            } else {
              technicianWorkload[`${r.Tecnico}_busy_${rInterval.name}`]++;
            }
          }
        }
      });
      customCoords.forEach(c => {
        if (c.category === 'Dirección de Técnicos' && c.note) {
          const techName = c.note.trim();
          technicianLocations[techName] = { lat: c.lat, lng: c.lng };
        }
      });
      const techDistances = {};
      Object.keys(technicianWorkload).forEach(tech => {
        if (tech.includes('_busy_')) return;
        const techLocation = technicianLocations[tech];
        if (techLocation && recordLat && recordLng) {
          const distance = calculateDistance(
            techLocation.lat, techLocation.lng,
            recordLat, recordLng
          );
          techDistances[tech] = distance;
        } else {
          techDistances[tech] = Infinity;
        }
      });
      const techniciansInSameDistrict = recordDistrict && techniciansByDistrict[recordDistrict] 
        ? Array.from(techniciansByDistrict[recordDistrict])
        : [];
      const allTechnicians = [...new Set(Object.keys(technicianWorkload).filter(t => !t.includes('_busy_')))];
      const availableTechnicians = allTechnicians.filter(tech => {
        if (!recordInterval) return true;
        return !technicianWorkload[`${tech}_busy_${recordInterval.name}`] || 
               technicianWorkload[`${tech}_busy_${recordInterval.name}`] < 3;
      });
      const scoredTechnicians = availableTechnicians.map(tech => {
        let score = 0;
        if (techniciansInSameDistrict.includes(tech)) {
          score += 100;
        }
        const distance = techDistances[tech];
        if (distance !== Infinity) {
          score += 50 / (1 + distance * 0.1);
        }
        const workload = technicianWorkload[tech] || 0;
        score -= workload * 5;
        return { tech, score };
      });
      scoredTechnicians.sort((a, b) => b.score - a.score);
      return scoredTechnicians.slice(0, 5).map(item => item.tech);
    }

    function calculateDistance(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = 
        Math.sin(dLat/2) * Math.sin(dLat/2) +
        Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
        Math.sin(dLon/2) * Math.sin(dLon/2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
      return R * c;
    }

    function handleKmlUpload(e) { 
      const file = e.target.files[0]; 
      if (!file) return;
      const msgEl = document.getElementById('kml-upload-msg');
      msgEl.textContent = "Procesando archivo KML..."; msgEl.className = "small mt-1 text-info";
      const modalHTML = `<div class="modal fade" id="categorySelectionModal" tabindex="-1" aria-labelledby="categorySelectionModalLabel" aria-hidden="true"><div class="modal-dialog"><div class="modal-content"><div class="modal-header"><h5 class="modal-title" id="categorySelectionModalLabel">Seleccionar Categoría</h5><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div><div class="modal-body"><p>Seleccione una categoría para todas las coordenadas del archivo KML:</p><select id="kml-category-select" class="form-select"><option value="Zona sin Cobertura">Zona sin Cobertura</option><option value="Sin FFTT">Sin FFTT</option><option value="Zona Peligrosa">Zona Peligrosa</option><option value="Dirección de Técnicos">Dirección de Técnicos</option></select></div><div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button><button type="button" class="btn btn-primary" id="confirm-category-btn">Confirmar</button></div></div></div></div>`;
      const modalContainer = document.createElement('div'); modalContainer.innerHTML = modalHTML; document.body.appendChild(modalContainer);
      const modalElement = document.getElementById('categorySelectionModal'), modal = new bootstrap.Modal(modalElement); modal.show();
      document.getElementById('confirm-category-btn').addEventListener('click', function () {
        const selectedCategory = document.getElementById('kml-category-select').value;
        modal.hide();
        showLoading(true);
        msgEl.textContent = "Procesando coordenadas del KML...";
        const reader = new FileReader();
        reader.onload = function (evt) {
          try {
            const kmlContent = evt.target.result;
            const parser = new DOMParser();
            const kmlDoc = parser.parseFromString(kmlContent, "text/xml");
            const placemarks = kmlDoc.getElementsByTagName('Placemark');
            if (placemarks.length === 0) {
              msgEl.textContent = "No se encontraron coordenadas válidas en el archivo KML.";
              msgEl.className = "small mt-1 text-warning";
              showLoading(false);
              return;
            }
            const newCoords = [];
            for (let i = 0; i < placemarks.length; i++) {
              const placemark = placemarks[i];
              const name = placemark.querySelector('name')?.textContent || '';
              const description = placemark.querySelector('description')?.textContent || '';
              const coordinates = placemark.getElementsByTagName('coordinates')[0]?.textContent.trim();
              if (!coordinates) continue;
              const parts = coordinates.split(',');
              if (parts.length < 2) continue;
              const lng = parseFloat(parts[0]), lat = parseFloat(parts[1]);
              if (isNaN(lat) || isNaN(lng)) continue;
              const entry = { id: Date.now() + i, lat, lng, category: selectedCategory, note: name || description || '', imgData: null, zone: selectedZone, kml: true };
              newCoords.push(entry);
            }
            
            console.log(`KML parsing: found ${placemarks.length} placemarks, created ${newCoords.length} valid coordinates`);
            
            const mergedMap = new Map();
            customCoords.forEach(c => {
              if (c.kml && c.zone === selectedZone) return;
              const key = `${c.lat},${c.lng},${c.zone}`;
              mergedMap.set(key, c);
            });
            newCoords.forEach(c => {
              const key = `${c.lat},${c.lng},${c.zone}`;
              const existing = mergedMap.get(key);
              if (existing && existing.imgData) {
                c.imgData = existing.imgData;
              }
              mergedMap.set(key, c);
            });
            customCoords = Array.from(mergedMap.values());
            localStorage.setItem(`customCoords_${selectedZone}`, JSON.stringify(customCoords));
            
            // Sync to Firebase
            if (typeof window.firebaseSave === 'function') {
              window.firebaseSave(`coords/${selectedZone}`, customCoords);
            }
            
            renderCustomCoordsList(); 
            updateCategoryCheckboxes(); 
            renderMarkers();
            msgEl.textContent = `Procesadas ${newCoords.length} coordenadas del archivo KML.`; 
            msgEl.className = "small mt-1 text-success";
            showLoading(false);
          } catch (error) {
            console.error("Error processing KML file:", error);
            msgEl.textContent = "Error al procesar el archivo KML: " + error.message; 
            msgEl.className = "small mt-1 text-danger"; 
            showLoading(false);
          }
        };
        reader.onerror = function () {
          msgEl.textContent = "Error al leer el archivo KML."; 
          msgEl.className = "small mt-1 text-danger"; 
          showLoading(false);
        };
        reader.readAsText(file);
      });
      modalElement.addEventListener('hidden.bs.modal', function () {
        if (modalContainer.parentNode === document.body) {
          document.body.removeChild(modalContainer);
        }
      });
    }

    function startCountdownTimer() {
      if (countdownInterval) {
        clearInterval(countdownInterval);
      }
      countdownInterval = setInterval(updateCountdowns, 1000);
    }

    function updateCountdowns() {
      const now = new Date();
      const hour = now.getHours();
      const pendingMarkers = markers.filter(m => {
        return m.record && m.record.Estado && /^Pendiente\s*-\s*(8\/12|12\/16|16\/20)$/.test(m.record.Estado);
      });
      let soonToExpire = 0;
      
      pendingMarkers.forEach(marker => {
        const record = marker.record;
        const estadoParts = record.Estado.split('-');
        if (estadoParts.length < 2) return;
        
        const timeRange = record.Estado.split('-')[1].trim();
        const interval = getIntervalFromRange(timeRange);
        if (!interval) return;
        
        const isWithinInterval = hour >= interval.start && hour < interval.end;
        const element = marker.getElement();
        if (!element) return;
        
        if (marker._tooltip && marker._tooltip._container) {
          const isFormatEnabled = shouldApplyFormatting(record.Estado);
          marker._tooltip._container.classList.toggle('estado-pendiente', isFormatEnabled);
        }
        
        if (!alertsEnabled) {
          return;
        }
        
        if (!isWithinInterval) {
          return;
        }
        
        const endTime = new Date(now);
        endTime.setHours(interval.end, 0, 0, 0);
        const remainingMs = endTime - now;
        const remainingMinutes = Math.floor(remainingMs / 60000);
        const remainingSeconds = Math.floor((remainingMs % 60000) / 1000);
        
        if (remainingMinutes <= 0 && remainingSeconds <= 0) {
          onCountdownEnd(record, marker);
          return;
        }
        
        if (remainingMinutes <= 10) soonToExpire++;
        const countdownText = `${remainingMinutes.toString().padStart(2, '0')}:${remainingSeconds.toString().padStart(2, '00')}`;
        
        let countdownOverlay = element.querySelector('.countdown-overlay');
        if (!countdownOverlay) {
          countdownOverlay = document.createElement('div');
          countdownOverlay.className = 'countdown-overlay';
          element.appendChild(countdownOverlay);
        }
        countdownOverlay.style.display = 'block';
        countdownOverlay.textContent = countdownText;
        
        if (currentRecord && currentRecord.id === record.id) {
          const detailCountdown = document.getElementById('detail-countdown');
          if (detailCountdown) {
            detailCountdown.textContent = `Tiempo restante (${record.Estado}): ${countdownText}`;
          }
        }
      });
      
      const globalOverlay = document.getElementById('global-timer-overlay');
      if (globalOverlay) {
        if (soonToExpire > 0 && alertsEnabled) {
          globalOverlay.style.display = 'block';
          globalOverlay.textContent = `${soonToExpire} pendiente${soonToExpire !== 1 ? 's' : ''} por vencer`;
        } else {
          globalOverlay.style.display = 'none';
        }
      }
    }

    function getIntervalFromRange(timeRange) {
      if (!timeRange) return null;
      const interval = INTERVALS.find(i => i.name === timeRange);
      return interval || null;
    }

    function onCountdownEnd(record, marker) {
      if (!alertsEnabled || !record.Estado || !/^Pendiente\s*-\s*(8\/12|12\/16|16\/20)$/.test(record.Estado)) {
        return;
      }
      
      const element = marker.getElement();
      if (element) {
        element.classList.add('countdown-expired');
        const countdownOverlay = element.querySelector('countdown-overlay');
        if (countdownOverlay) countdownOverlay.textContent = 'EXPIRADO';
      }
      
      marker.bindPopup(`Tiempo agotado (${record.Estado})`).openPopup();
      
      const alertSound = document.getElementById('alert-sound');
      if (alertSound) alertSound.play();
      
      if (Notification.permission === 'granted') {
        new Notification('Tiempo agotado', {
          body: `Registro ${record.Codigo} (${record.Estado}): ${record.Cliente} ha expirado`,
          icon: 'https://cdn-icons-png.flaticon.com/512/1865/1865269.png'
        });
      }
    }

    function updateCategoryCheckboxes() {
      const container = document.getElementById('category-checkboxes');

      container.innerHTML = '';
      const counts = {};
      customCoords.forEach(coord => {
        const zone = coord.zone || selectedZone;
        const categoryKey = `${coord.category}-${zone}`;
        counts[categoryKey] = (counts[categoryKey] || 0) + 1;
      });
      const uniqueCategories = [...new Set(customCoords.map(c => c.category))];
      uniqueCategories.forEach(category => {
        ['LIMA', 'PROVINCIA'].forEach(zone => {
          const categoryKey = `${category}-${zone}`;
          if (!counts[categoryKey]) return;
          const categoryId = `category-${category.replace(/\s+/g, '-').toLowerCase()}-${zone}`;
          const div = document.createElement('div');
          div.className = 'form-check d-flex align-items-center';
          div.dataset.zone = zone;
          div.style.display = zone === selectedZone ? 'flex' : 'none';
          
          const checkbox = document.createElement('input');
          checkbox.className = 'form-check-input';
          checkbox.type = 'checkbox';
          checkbox.id = categoryId;
          checkbox.dataset.category = category;
          checkbox.dataset.zone = zone;
          checkbox.checked = localStorage.getItem(categoryId) !== 'false';
          
          const label = document.createElement('label');
          label.className = 'form-check-label me-2';
          label.htmlFor = categoryId;
          let displayText = category === 'Dirección de Técnicos' ? 'Técnicos' : category;
          label.textContent = `${displayText} (${counts[categoryKey]}) - ${zone}`;
          
          const imageBtn = document.createElement('button');
          imageBtn.className = 'btn btn-sm btn-outline-secondary assign-category-image-btn ms-2';
          imageBtn.innerHTML = '<i class="fas fa-image"></i>';
          imageBtn.title = 'Asignar imagen a todas';
          imageBtn.dataset.category = category;
          
          const fileInput = document.createElement('input');
          fileInput.type = 'file';
          fileInput.accept = '.jpg,.jpeg,.png';
          fileInput.className = 'visually-hidden';
          fileInput.id = `category-image-${categoryId}`;
          imageBtn.addEventListener('click', () => fileInput.click());
          fileInput.addEventListener('change', function (e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function (evt) {
              const imgData = evt.target.result;
              let updatedCount = 0;
              customCoords.forEach(coord => {
                if (coord.category === category && (coord.zone || selectedZone) === zone) {
                  coord.imgData = imgData;
                  updatedCount++;
                }
              });
              localStorage.setItem(`customCoords_${selectedZone}`, JSON.stringify(customCoords));
              if (typeof window.firebaseSave === 'function') {
                window.firebaseSave(`coords/${selectedZone}`, customCoords);
              }
              renderMarkers();
              alert(`Imagen aplicada a ${updatedCount} coordenadas en la categoría "${category}" - ${zone}`);
              fileInput.value = '';
            };
            reader.readAsDataURL(file);
          });
          
          div.appendChild(checkbox);
          div.appendChild(label);
          div.appendChild(imageBtn);
          div.appendChild(fileInput);
          container.appendChild(div);
          
          checkbox.addEventListener('change', function () {
            localStorage.setItem(this.id, this.checked);
            renderMarkers();
          });
        });
      });
    }

    function saveAndRenderCoord(entry) {
      entry.zone = selectedZone;
      const mergedMap = new Map();
      customCoords.forEach(c => {
        const key = `${c.lat},${c.lng},${c.zone}`;
        mergedMap.set(key, c);
      });
      const keyNew = `${entry.lat},${entry.lng},${entry.zone}`;
      const existing = mergedMap.get(keyNew);
      if (existing && existing.imgData && !entry.imgData) {
        entry.imgData = existing.imgData;
      }
      mergedMap.set(keyNew, entry);
      customCoords = Array.from(mergedMap.values());
      localStorage.setItem(`customCoords_${selectedZone}`, JSON.stringify(customCoords));
      
      // Sync to Firebase
      if (typeof window.firebaseSave === 'function') {
        window.firebaseSave(`coords/${selectedZone}`, customCoords);
      }
      
      renderCustomCoordsList();
      updateCategoryCheckboxes();
      renderMarkers();
      ['coord-input', 'coord-category', 'coord-note', 'coord-image'].forEach(id => document.getElementById(id).value = '');
      alert('Coordenada guardada correctamente');
    }

    function renderCustomCoordsList() {
      const ul = document.getElementById('coord-list'); ul.innerHTML = '';
      customCoords.forEach(c => {
        const li = document.createElement('li'); li.className = 'list-group-item d-flex justify-content-between align-items-center';
        li.innerHTML = `<div>${c.category} (${c.lat.toFixed(4)}, ${c.lng.toFixed(4)})<br><small>${c.note || ''}</small></div><button class="btn btn-sm btn-danger">&times;</button>`;
        li.querySelector('button').addEventListener('click', () => {
          customCoords = customCoords.filter(x => x.id !== c.id);
          localStorage.setItem(`customCoords_${selectedZone}`, JSON.stringify(customCoords));
          
          // Sync to Firebase
          if (typeof window.firebaseSave === 'function') {
            window.firebaseSave(`coords/${selectedZone}`, customCoords);
          }
          
          renderCustomCoordsList(); renderMarkers();
        });
        ul.appendChild(li);
      });
      updateCategoryCheckboxes();
    }

    function deleteRecordsByCategory(category) {
      const modalHTML = `<div class="modal fade" id="deleteCategoryModal" tabindex="-1" aria-labelledby="deleteCategoryModalLabel" aria-hidden="true"><div class="modal-dialog"><div class="modal-content"><div class="modal-header"><h5 class="modal-title" id="deleteCategoryModalLabel">Confirmar Eliminación</h5><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div><div class="modal-body"><p>¿Desea eliminar completamente la categoría <strong>${category}</strong>?</p><p class="text-danger">Esta acción no se puede deshacer y eliminará permanentemente todos los puntos de esta categoría.</p></div><div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button><button type="button" class="btn btn-danger" id="confirm-delete-category-btn">Eliminar Permanentemente</button></div></div></div></div>`;
      const modalContainer = document.createElement('div'); modalContainer.innerHTML = modalHTML; document.body.appendChild(modalContainer);
      const modalElement = document.getElementById('deleteCategoryModal'), modal = new bootstrap.Modal(modalElement); modal.show();
      document.getElementById('confirm-delete-category-btn').addEventListener('click', function () {
        const recordsToDelete = customCoords.filter(c => c.category === category);
        customCoords = customCoords.filter(c => c.category !== category);
        const deletedRecords = JSON.parse(localStorage.getItem('deletedRecordsByCategory') || '{}');
        deletedRecords[category] = recordsToDelete;
        localStorage.setItem('deletedRecordsByCategory', JSON.stringify(deletedRecords));
        localStorage.setItem(`customCoords_${selectedZone}`, JSON.stringify(customCoords));
        
        // Sync to Firebase
        if (typeof window.firebaseSave === 'function') {
          window.firebaseSave(`deletedRecords/${selectedZone}`, deletedRecords);
          window.firebaseSave(`coords/${selectedZone}`, customCoords);
        }
        
        renderCustomCoordsList(); updateCategoryCheckboxes(); renderMarkers();
        document.getElementById('detail-panel').classList.remove('open');
        modal.hide();
        alert(`La categoría "${category}" ha sido eliminada.`);
      });
      modalElement.addEventListener('hidden.bs.modal', function () {
        if (modalContainer.parentNode === document.body) {
          document.body.removeChild(modalContainer);
        }
      });
    }

    function restoreRecordsByCategory(category) {
      const deletedRecords = JSON.parse(localStorage.getItem('deletedRecordsByCategory') || '{}');
      if (!deletedRecords[category] || deletedRecords[category].length === 0) return;
      customCoords = customCoords.concat(deletedRecords[category]);
      delete deletedRecords[category];
      localStorage.setItem('deletedRecordsByCategory', JSON.stringify(deletedRecords));
      localStorage.setItem(`customCoords_${selectedZone}`, JSON.stringify(customCoords));
      
      // Sync to Firebase
      if (typeof window.firebaseSave === 'function') {
        window.firebaseSave(`deletedRecords/${selectedZone}`, deletedRecords);
        window.firebaseSave(`coords/${selectedZone}`, customCoords);
      }
      
      renderCustomCoordsList();
      updateCategoryCheckboxes();
      renderMarkers();
      document.getElementById('detail-panel').classList.remove('open');
      alert(`La categoría "${category}" ha sido restaurada.`);
    }

    function renderTechnicianSummary() {
      const summaryContent = document.getElementById('tech-summary-content');
      if (!summaryContent) return;
      const techSummary = {};
      const noTechName = "Sin técnico";
      allRecords.forEach(record => {
        const techName = record.Tecnico || noTechName;
        if (!techSummary[techName]) {
          techSummary[techName] = {
            pendiente: 0,
            coordinado: 0,
            encamino: 0,
            iniciado: 0
          };
        }
        const estado = record.Estado?.toLowerCase() || '';
        const estado2 = record.Estado2?.toLowerCase() || '';
        if (estado.includes('pendiente') || estado2.includes('pendiente')) {
          techSummary[techName].pendiente++;
        } else if (estado.includes('coord') || estado2.includes('coord')) {
          techSummary[techName].coordinado++;
        } else if (estado.includes('camino') || estado2.includes('camino')) {
          techSummary[techName].encamino++;
        } else if (estado.includes('inicia') || estado2.includes('inicia')) {
          techSummary[techName].iniciado++;
        }
      });
      let html = '<table class="table table-sm table-borderless mb-0">';
      html += '<thead><tr>';
      html += '<th>Técnico</th><th>Pend</th>';
      html += '</tr></thead><tbody>';
      const sortedTechs = Object.keys(techSummary).sort((a, b) => {
        if (a === noTechName) return 1;
        if (b === noTechName) return -1;
        return a.localeCompare(b);
      });
      sortedTechs.forEach(tech => {
        const summary = techSummary[tech];
        const pendingTotal = summary.pendiente + summary.coordinado + summary.encamino + summary.iniciado;
        const isSuggested = window.currentSuggestions && window.currentSuggestions.includes(tech);
        const highlightClass = isSuggested ? 'tech-suggested-highlight' : '';
        html += '<tr>';
        html += `<td class="text-nowrap ${highlightClass}">${tech}</td>`;
        html += `<td><span class="badge bg-yellow text-dark">${pendingTotal}</span></td>`;
        html += '</tr>';
      });
      html += '</tbody></table>';
      summaryContent.innerHTML = html;
    }

    function showContextMenu(x, y, record) {
      const contextMenu = document.getElementById('context-menu');
      if (!contextMenu) return;
      
      contextMenu.style.left = `${x}px`;
      contextMenu.style.top = `${y}px`;
      
      // Sort the technician list alphabetically
      technicianList.sort((a, b) => a.localeCompare(b));
      
      let menuHTML = `
        <div class="context-menu-header">Asignar Técnico</div>
        <div class="context-menu-item" data-tech="">Sin técnico</div>
        <div class="context-menu-separator"></div>
      `;
      
      // Modified loop with sorted technicianList
      technicianList.forEach(tech => {
        const isCurrent = tech === record.Tecnico;
        menuHTML += `<div class="context-menu-item ${isCurrent ? 'bg-light fw-bold' : ''}" data-tech="${tech}">${tech}</div>`;
      });
      
      menuHTML += `

        <button class="btn btn-sm btn-primary context-menu-add-btn" id="add-tech-btn">Agregar Técnico</button>
      `;
      contextMenu.innerHTML = menuHTML;
      contextMenu.style.display = 'block';
      
      contextMenu.querySelectorAll('.context-menu-item').forEach(item => {
        item.addEventListener('click', function() {
          if (this.getAttribute('data-action') === 'delete-tech') {
            const currentTech = record.Tecnico;

              contextMenu.style.display = 'none';
              return;
            }
            technicianList = technicianList.filter(tech => tech !== currentTech);
            localStorage.setItem('technicianList', JSON.stringify(technicianList));
          if (typeof window.firebaseSave === 'function') {
            window.firebaseSave('technicianList', technicianList);
          }
            updateRecordTechnician(record.id, '');
            showContextMenu(x, y, record);

          }
          const tech = this.getAttribute('data-tech');
          updateRecordTechnician(record.id, tech);
          showRecordDetails(record);
          contextMenu.style.display = 'none';
        });
      });
      const addTechBtn = document.getElementById('add-tech-btn');
      if (addTechBtn) {
        addTechBtn.addEventListener('click', function() {
          const input = document.getElementById('new-tech-input');
          if (!input || !input.value.trim()) return;
          const newTech = input.value.trim();
          if (!technicianList.includes(newTech)) {
            technicianList.push(newTech);
            // Sort the list after adding a new technician
            technicianList.sort((a, b) => a.localeCompare(b));
            localStorage.setItem('technicianList', JSON.stringify(technicianList));
          if (typeof window.firebaseSave === 'function') {
            window.firebaseSave('technicianList', technicianList);
          }
          }
          updateRecordTechnician(record.id, newTech);
          showRecordDetails(record);
          contextMenu.style.display = 'none';
        });
      }
      const newTechInput = document.getElementById('new-tech-input');
      if (newTechInput) {
        newTechInput.addEventListener('keypress', function(e) {
          if (e.key === 'Enter' && this.value.trim()) {
            const newTech = this.value.trim();
            if (!technicianList.includes(newTech)) {
              technicianList.push(newTech);
              // Sort the list after adding a new technician
              technicianList.sort((a, b) => a.localeCompare(b));
              localStorage.setItem('technicianList', JSON.stringify(technicianList));
          if (typeof window.firebaseSave === 'function') {
            window.firebaseSave('technicianList', technicianList);
          }
            }
            updateRecordTechnician(record.id, newTech);
            showRecordDetails(record);
            contextMenu.style.display = 'none';
          }
        });
      }
    }

    if (localStorage.getItem('showTooltips') === null) {
      localStorage.setItem('showTooltips', 'true');
    }
